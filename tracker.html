async function exportData() {
  const data = JSON.stringify({ app: "gut-log", version: 1, exported: new Date().toISOString(), settings: state.settings, days: state.days }, null, 2);
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch (e) { dl = null; }
  if (dl) {
    try { await dl.save({ filename: `gut-log-${todayIso()}.json`, data }); toast("Backup saved"); return; } catch (e) { /* fall back to copy */ }
  }
  try { await navigator.clipboard.writeText(data); toast("Backup copied to the clipboard"); }
  catch (e) { toast("Could not export from this view."); }
}
async function doImport() {
  const o = state.confirmImport; state.confirmImport = null;
  const days = o.days || {};
  if (o.settings) { state.settings = Object.assign(state.settings, o.settings); }
  Object.assign(state.days, days);
  render();
  if (db) {
    try {
      for (const [k, v] of Object.entries(days)) await db.doc("days/" + k).set(v);
      if (o.settings) await db.doc("settings/main").set(state.settings);
      toast(`Imported ${Object.keys(days).length} days`);
    } catch (e) { toast("Import stopped partway. Try again."); }
  } else { localSave(); toast(`Imported ${Object.keys(days).length} days`); }
}

/* ---------- Render and events ---------- */
function render() {
  const sched = buildSchedule(state.settings);
  renderHeader(sched);
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === state.tab)));
  const view = document.getElementById("view");
  const active = document.activeElement;
  const keepNote = active && active.id === "dayNote";
  if (keepNote) return; // do not wipe the note while typing
  view.innerHTML = state.tab === "today" ? renderToday(sched) : state.tab === "insights" ? renderInsights(sched) : state.tab === "plan" ? renderPlan(sched) : renderSettings();
  if (state.tab === "insights") { drawDaily(sched); drawHours(); drawDayLines(); }
}

document.addEventListener("click", ev => {
  const el = ev.target.closest("button, [data-tab]");
  if (!el) { if (ev.target.id === "scrim") closeSheet(); return; }
  const d = el.dataset;
  if (d.tab) { state.tab = d.tab; try { localStorage.setItem("gutlog-tab", d.tab); } catch (e) {} render(); window.scrollTo(0, 0); return; }
  if (el.id === "prevDay") { state.date = addDays(state.date, -1); state.editing = null; render(); return; }
  if (el.id === "nextDay") { if (state.date < todayIso()) state.date = addDays(state.date, 1); state.editing = null; render(); return; }
  if (el.id === "todayBtn") { state.date = todayIso(); render(); return; }
  if (d.stool) return logEvent("stool", Number(d.stool));
  if (d.bloat) return logEvent("bloat", Number(d.bloat));
  if (d.sym) return logEvent(d.sym);
  if (d.edit) { state.editing = d.edit; render(); return; }
  if (d.del) return deleteEvent(d.del);
  if (el.hasAttribute("data-done")) { state.editing = null; render(); return; }
  if (el.id === "chLog") { const e = buildSchedule(state.settings).map[state.date]; if (e) logChallenge(e); return; }
  if (el.id === "chUndo") { const day = structuredClone(getDay(state.date)); day.challenge = null; saveDay(day); return; }
  if (d.meal) return openMeal(d.meal);
  if (d.pick != null && state.sheet) {
    const s = state.sheet; const f = d.pick;
    s.foods = s.foods.includes(f) ? s.foods.filter(x => x !== f) : [...s.foods, f];
    const body = document.getElementById("sheetBody"); const st = body.scrollTop;
    renderSheet(); document.getElementById("sheetBody").scrollTop = st; return;
  }
  if (el.id === "copyPrev" && state.sheet) {
    const pm = ((state.days[addDays(state.date, -1)] || {}).meals || {})[state.sheet.k];
    state.sheet.foods = [...new Set([...state.sheet.foods, ...(pm.foods || [])])]; renderSheet(); return;
  }
  if (el.id === "addCustom") return addCustom();
  if (el.id === "toggleCh" && state.sheet) { state.sheet.ch = !state.sheet.ch; const st = document.getElementById("sheetBody").scrollTop; renderSheet(); document.getElementById("sheetBody").scrollTop = st; return; }
  if (el.id === "saveMeal") return saveMeal(false);
  if (el.id === "clearMeal") return saveMeal(true);
  if (d.range) { state.range = Number(d.range); render(); return; }
  if (d.rest) {
    const n = d.rest; const er = { ...(state.settings.extraRest || {}) };
    er[n] = Math.max(0, (er[n] || 0) + Number(d.delta));
    state.settings = { ...state.settings, extraRest: er }; saveSettings(); return;
  }
  if (el.id === "addFoodBtn") return addFood();
  if (d.rmfood) {
    const removed = findAdded(d.rmfood); const before = addedFoods();
    state.settings = { ...state.settings, addedFoods: before.filter(a => a !== removed) }; saveSettings();
    toast(`${removed.name} removed from your list`, () => { state.settings = { ...state.settings, addedFoods: before }; saveSettings(); });
    return;
  }
  if (d.rmcustom) { state.settings = { ...state.settings, customFoods: (state.settings.customFoods || []).filter(x => x !== d.rmcustom) }; saveSettings(); return; }
  if (el.id === "exportBtn") return exportData();
  if (el.id === "importYes") return doImport();
  if (el.id === "importNo") { state.confirmImport = null; render(); return; }
});

function addFood() {
  const name = document.getElementById("newFoodName").value.trim().replace(/\s+/g, " ");
  const cat = document.getElementById("newFoodCat").value;
  const h = document.getElementById("newFoodH").checked, g = document.getElementById("newFoodG").checked;
  if (!name) { toast("Type a food name first"); document.getElementById("newFoodName").focus(); return; }
  if (onList(name)) { toast(`${name} is already on your list`); return; }
  state.lastCat = cat;
  state.settings = { ...state.settings,
    addedFoods: [...addedFoods(), { name, cat, h, g }],
    customFoods: (state.settings.customFoods || []).filter(x => x.toLowerCase() !== name.toLowerCase()) };
  saveSettings();
  toast(`${name} added to ${cat}`);
  const inp = document.getElementById("newFoodName"); if (inp) inp.focus();
}

function addCustom() {
  const inp = document.getElementById("customFood");
  const v = inp.value.trim(); if (!v || !state.sheet) return;
  if (!state.sheet.foods.includes(v)) state.sheet.foods.push(v);
  if (!onList(v) && !(state.settings.customFoods || []).includes(v)) {
    state.settings = { ...state.settings, customFoods: [...(state.settings.customFoods || []), v] };
    saveSettings();
  }
  renderSheet();
  document.getElementById("customFood").focus();
}

document.addEventListener("input", ev => {
  const t = ev.target;
  if (t.id === "foodSearch" && state.sheet) {
    state.sheet.q = t.value;
    renderSheet();
    const s = document.getElementById("foodSearch"); s.focus(); s.setSelectionRange(s.value.length, s.value.length);
  }
  if (t.id === "mealNote" && state.sheet) state.sheet.note = t.value;
  if (t.id === "mealTime" && state.sheet) state.sheet.time = t.value;
  if (t.id === "sheetChGrams" && state.sheet) state.sheet.chGrams = t.value === "" ? null : Number(t.value);
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Enter" && ev.target.id === "customFood") { ev.preventDefault(); addCustom(); }
  if (ev.key === "Enter" && ev.target.id === "newFoodName") { ev.preventDefault(); addFood(); }
  if (ev.key === "Escape" && state.sheet) closeSheet();
});
document.addEventListener("change", ev => {
  const t = ev.target;
  if (t.dataset.evtime) return setEventTime(t.dataset.evtime, t.value);
  if (t.id === "chGrams") { const day = structuredClone(getDay(state.date)); if (day.challenge && t.value !== "") { day.challenge.grams = Number(t.value); saveDay(day); } return; }
  if (t.id === "chMeal") { const day = structuredClone(getDay(state.date)); if (day.challenge) { day.challenge.meal = t.value; saveDay(day); } return; }
  if (t.id === "chTime") { const day = structuredClone(getDay(state.date)); if (day.challenge && t.value) { day.challenge.t = t.value; saveDay(day); } return; }
  if (t.id === "dayNote") { const day = structuredClone(getDay(state.date)); day.note = t.value; t.blur(); saveDay(day); return; }
  if (t.id === "planStart" && t.value) { state.settings = { ...state.settings, planStart: t.value }; saveSettings(); return; }
  if (t.dataset.outcome) { const o = { ...(state.settings.outcomes || {}) }; o[t.dataset.outcome] = { ...(o[t.dataset.outcome] || {}), result: t.value }; state.settings = { ...state.settings, outcomes: o }; saveSettings(); return; }
  if (t.dataset.portion) { const o = { ...(state.settings.outcomes || {}) }; o[t.dataset.portion] = { ...(o[t.dataset.portion] || {}), portion: t.value }; state.settings = { ...state.settings, outcomes: o }; saveSettings(); return; }
  if (t.id === "importFile" && t.files && t.files[0]) {
    const fr = new FileReader();
    fr.onload = () => { try { const o = JSON.parse(fr.result); if (!o || typeof o.days !== "object") throw 0; state.confirmImport = o; render(); } catch (e) { toast("That file is not a Gut Log backup."); } };
    fr.readAsText(t.files[0]);
  }
});
document.addEventListener("focusout", ev => {
  if (ev.target.id === "dayNote") { const day = getDay(state.date); if ((day.note || "") !== ev.target.value) { const d2 = structuredClone(day); d2.note = ev.target.value; saveDay(d2); } else setTimeout(render, 0); }
});
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (state.tab === "insights") render(); }, 150); });

initStorage();
})();
</script>
