<title>Gut Log</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: phone-first single column (max 680px), sticky day header on top, tab bar fixed at the bottom like a native app. */
:root {
  --bg: #EEF3F1;
  --surface: #FFFFFF;
  --surface-2: #E4ECE9;
  --ink: #12211D;
  --muted: #5B6D67;
  --line: #D3DEDA;
  --accent: #0D6B62;
  --accent-ink: #FFFFFF;
  --accent-soft: #D6EBE6;
  --hero: #0F4F49;
  --hero-ink: #F1FAF7;
  --hero-muted: #A9CFC7;
  --bloat: #C47510;
  --burp: #B8407E;
  --gas: #2E6FD6;
  --diar: #5B6B1E;
  --hard: #A8621C;
  --ideal: #2E8552;
  --loose: #C23F38;
  --hist: #C62828;
  --gluc: #7B2FBE;
  --stool-ink: #6E4B33;
  --shadow: 0 1px 2px rgba(18,33,29,.06), 0 8px 24px rgba(18,33,29,.06);
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1513; --surface: #16201D; --surface-2: #1E2A27; --ink: #E4EEEA; --muted: #98ABA5; --line: #2A3834;
    --accent: #4CC0B2; --accent-ink: #062320; --accent-soft: #173A35; --hero: #123B36; --hero-ink: #EAF7F3; --hero-muted: #8FC2B8;
    --bloat: #B98029; --burp: #D0679E; --gas: #4E8BE6; --diar: #5B6B1E; --hard: #D2924F; --ideal: #5BBE85; --loose: #EC7670;
    --hist: #F07A7A; --gluc: #C18CF2; --stool-ink: #D7B79C; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1513; --surface: #16201D; --surface-2: #1E2A27; --ink: #E4EEEA; --muted: #98ABA5; --line: #2A3834;
  --accent: #4CC0B2; --accent-ink: #062320; --accent-soft: #173A35; --hero: #123B36; --hero-ink: #EAF7F3; --hero-muted: #8FC2B8;
  --bloat: #B98029; --burp: #D0679E; --gas: #4E8BE6; --diar: #5B6B1E; --hard: #D2924F; --ideal: #5BBE85; --loose: #EC7670;
  --hist: #F07A7A; --gluc: #C18CF2; --stool-ink: #D7B79C; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--hero); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.wrap { max-width: 680px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Hero header */
.hero { background: var(--hero); color: var(--hero-ink); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
.hero .wrap { padding-block: 14px 16px; display: grid; gap: 10px; }
.hero-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
.brand svg { width: 22px; height: 22px; }
.daynav { display: flex; align-items: center; gap: 4px; }
.daynav button { background: transparent; border: 1px solid color-mix(in srgb, var(--hero-ink) 25%, transparent); color: var(--hero-ink); border-radius: 999px; height: 34px; min-width: 34px; padding: 0 10px; display: grid; place-items: center; }
.daynav button:hover { background: color-mix(in srgb, var(--hero-ink) 10%, transparent); }
.daynav button:disabled { opacity: .35; cursor: default; }
.daytitle { font-family: var(--font-display); font-size: 26px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; text-wrap: balance; }
.daysub { color: var(--hero-muted); font-size: 13px; }
.phase { display: inline-flex; align-items: center; gap: 8px; background: color-mix(in srgb, var(--hero-ink) 12%, transparent); border-radius: 999px; padding: 5px 12px 5px 8px; font-size: 13px; font-weight: 700; width: fit-content; max-width: 100%; }
.phase .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--hero-muted); flex: none; }
.phase.ph-ch .dot { background: #F2C14E; }
.phase.ph-rest .dot { background: #8FD3C4; }

main { padding-block: 16px 120px; display: grid; gap: 18px; }
section.card { background: var(--surface); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); display: grid; gap: 12px; min-width: 0; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h2 { font-family: var(--font-display); font-size: 18px; font-weight: 700; margin: 0; letter-spacing: -.01em; }
h3 { font-family: var(--font-display); font-size: 15px; font-weight: 700; margin: 0; }
.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.hint { color: var(--muted); font-size: 13px; margin: 0; }
p { margin: 0; }

/* Challenge card */
.challenge { background: var(--accent-soft); border-radius: var(--r); padding: 16px; display: grid; gap: 10px; }
.challenge .big { font-family: var(--font-display); font-size: 22px; font-weight: 700; letter-spacing: -.01em; line-height: 1.15; }
.challenge .grams { font-family: var(--font-mono); font-size: 22px; color: var(--accent); }
.daydots { display: flex; gap: 6px; }
.daydots span { height: 6px; flex: 1; border-radius: 3px; background: color-mix(in srgb, var(--accent) 22%, transparent); }
.daydots span.on { background: var(--accent); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 14px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.small { padding: 6px 10px; font-size: 13px; border-radius: 10px; }
.btn.danger { color: var(--loose); }
.done-pill { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; color: var(--accent); }

/* Quick log */
.qgroup { display: grid; gap: 8px; }
.bristol { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.bbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 8px 2px 6px; display: grid; justify-items: center; gap: 2px; min-height: 84px; transition: transform .08s ease, background .15s; }
.bbtn:hover { background: var(--surface-2); }
.bbtn:active { transform: scale(.95); }
.bbtn svg { width: 100%; max-width: 46px; height: 30px; color: var(--stool-ink); }
.bbtn .n { font-family: var(--font-mono); font-size: 15px; }
.bbtn .band { width: 18px; height: 4px; border-radius: 2px; }
.bbtn.on { border: 2px solid var(--accent); background: var(--accent-soft); padding: 7px 1px 5px; }
.sizes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.size { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 4px; font-weight: 700; display: grid; justify-items: center; align-content: center; gap: 6px; min-height: 64px; }
.size:hover { background: var(--surface-2); }
.size.on { border: 2px solid var(--accent); background: var(--accent-soft); color: var(--accent); }
.size i { display: block; border-radius: 50%; background: var(--stool-ink); }
.bandlegend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.bandlegend i { display: inline-block; width: 14px; height: 4px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
.symrow { display: grid; grid-template-columns: 1.6fr 1fr 1fr; gap: 8px; }
.sbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 12px; text-align: left; display: grid; gap: 6px; transition: transform .08s ease, background .15s; min-width: 0; }
.sbtn:active { transform: scale(.97); }
.sbtn:hover { background: var(--surface-2); }
.sbtn .lbl { font-weight: 700; display: flex; align-items: center; gap: 8px; }
.sbtn .cnt { font-size: 12px; color: var(--muted); }
.swatch { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.sev { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.sev button { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 4px; font-size: 13px; font-weight: 700; display: grid; justify-items: center; gap: 4px; }
.sev button:hover { background: var(--surface-2); }
.sev .bars { display: flex; gap: 2px; align-items: flex-end; height: 12px; }
.sev .bars i { width: 4px; border-radius: 1px; background: var(--line); }
.sev .bars i.on { background: var(--bloat); }
.bloatbox { border: 1px solid var(--line); border-radius: 14px; padding: 10px; display: grid; gap: 8px; min-width: 0; }

/* Timeline */
.tl { display: grid; gap: 0; }
.tl-item { display: grid; grid-template-columns: 52px 18px 1fr auto; gap: 8px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); }
.tl-item:last-child { border-bottom: 0; }
.tl-time { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.tl-mark { display: block; align-self: center; width: 12px; height: 12px; border-radius: 50%; justify-self: center; }
.tl-mark.mealm { border-radius: 3px; background: var(--surface-2); border: 2px solid var(--muted); }
.tl-mark.ch { background: var(--accent); transform: rotate(45deg); border-radius: 2px; }
.tl-text { min-width: 0; overflow-wrap: anywhere; }
.tl-text small { color: var(--muted); }
.tl-edit { display: flex; gap: 6px; align-items: center; }
.tl-edit input[type=time] { border: 1px solid var(--line); border-radius: 8px; padding: 4px 6px; background: var(--surface); font-family: var(--font-mono); font-size: 13px; width: 96px; }
.iconbtn { border: 0; background: transparent; color: var(--muted); border-radius: 8px; padding: 4px 6px; }
.iconbtn:hover { color: var(--loose); background: var(--surface-2); }
.empty { color: var(--muted); font-size: 14px; padding: 14px; border: 1px dashed var(--line); border-radius: 12px; text-align: center; }

/* Meals */
.meals { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.meal { border: 1px solid var(--line); border-radius: 14px; padding: 12px; background: var(--surface); text-align: left; display: grid; gap: 8px; align-content: start; min-height: 96px; min-width: 0; }
.meal:hover { border-color: var(--accent); }
.meal.has-ch { border: 2px solid var(--accent); background: var(--accent-soft); padding: 11px; }
.ch-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.ch-badge::before { content: ""; width: 8px; height: 8px; background: var(--accent); transform: rotate(45deg); border-radius: 1px; }
.ch-sheet { border: 2px dashed var(--accent); border-radius: 14px; padding: 12px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.ch-sheet.on { border-style: solid; background: var(--accent-soft); }
.ch-sheet strong { font-family: var(--font-display); font-size: 17px; }
.ch-ctl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ch-ctl input, .ch-ctl select { border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; background: var(--surface); }
.ch-ctl input[type=number] { width: 76px; font-family: var(--font-mono); }
.meal-head { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.meal-head span:last-child { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { font-size: 12.5px; background: var(--surface-2); border-radius: 999px; padding: 3px 9px; display: inline-flex; align-items: center; gap: 5px; max-width: 100%; overflow-wrap: anywhere; }
.chip.ch { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.chip .fl { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.meal .add { color: var(--accent); font-weight: 700; font-size: 13px; }
.snacks { gap: 6px; }
.snack-row { border: 0; border-top: 1px solid var(--line); background: transparent; text-align: left; padding: 8px 0 4px; display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; align-items: start; border-radius: 0; }
.snack-row:hover .snack-t { color: var(--accent); }
.snack-t { font-size: 12px; color: var(--muted); padding-top: 4px; }
.snack-note { grid-column: 2; }
.snack-add { border: 0; background: transparent; text-align: left; padding: 6px 0 0; justify-self: start; }
.warn { font-size: 13px; color: var(--hard); background: color-mix(in srgb, var(--hard) 10%, transparent); padding: 8px 10px; border-radius: 10px; }
textarea.note { width: 100%; min-height: 64px; border: 1px solid var(--line); border-radius: 12px; padding: 10px; background: var(--surface); resize: vertical; }

/* Sheet */
.scrim { position: fixed; inset: 0; background: rgba(8,16,14,.45); z-index: 40; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; background: var(--surface); border-radius: 22px 22px 0 0; max-height: 88%; display: grid; grid-template-rows: auto 1fr auto; box-shadow: 0 -10px 40px rgba(0,0,0,.2); max-width: 680px; margin: 0 auto; }
.sheet-head, .sheet-foot { padding: 14px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 10px; }
.sheet-foot { border-top: 1px solid var(--line); padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
.sheet-body { overflow-y: auto; padding: 4px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; align-content: start; }
.grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); justify-self: center; }
.field { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--surface); width: 100%; min-width: 0; }
.picker-cat { display: grid; gap: 8px; }
.pick { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 11px; font-size: 13.5px; display: inline-flex; align-items: center; gap: 6px; }
.pick.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.pick .fl { width: 7px; height: 7px; border-radius: 50%; }
.legend-fl { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend-fl span { display: inline-flex; align-items: center; gap: 5px; }
.legend-fl i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

/* Tabs */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar .wrap { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding-block: 8px; }
.tab { border: 0; background: transparent; border-radius: 12px; padding: 8px 4px; display: grid; justify-items: center; gap: 2px; font-size: 12px; font-weight: 700; color: var(--muted); }
.tab svg { width: 22px; height: 22px; }
.tab[aria-selected="true"] { color: var(--accent); background: var(--accent-soft); }

/* Insights */
.seg { display: inline-flex; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; border-radius: 9px; padding: 6px 12px; font-weight: 700; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { background: var(--surface); border-radius: var(--r); padding: 14px; box-shadow: var(--shadow); display: grid; gap: 4px; min-width: 0; }
.tile .v { font-family: var(--font-display); font-size: 30px; font-weight: 700; letter-spacing: -.02em; line-height: 1; font-variant-numeric: tabular-nums; }
.tile .l { font-size: 13px; font-weight: 700; display: flex; gap: 6px; align-items: center; }
.tile .s { font-size: 12px; color: var(--muted); }
.chartbox { position: relative; overflow-x: auto; }
.chartbox svg { display: block; }
.chartbox text { font-family: var(--font-body); }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; padding: 8px 10px; border-radius: 10px; line-height: 1.4; z-index: 5; max-width: 230px; box-shadow: var(--shadow); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.tablewrap { overflow-x: auto; }
table.rt { border-collapse: collapse; width: 100%; font-size: 13px; min-width: 460px; }
table.rt th { text-align: left; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding: 6px 8px; border-bottom: 1px solid var(--line); }
table.rt td { padding: 8px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; vertical-align: top; }
table.rt td.num { font-family: var(--font-mono); }
.block-res table.rt td:first-child { min-width: 170px; }
.hi { background: color-mix(in srgb, var(--loose) 14%, transparent); color: var(--loose); font-weight: 700; border-radius: 6px; padding: 1px 6px; }
.block-res { border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 10px; min-width: 0; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 3px 10px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill.good { background: color-mix(in srgb, var(--ideal) 16%, transparent); color: var(--ideal); }
.pill.mid { background: color-mix(in srgb, var(--hard) 16%, transparent); color: var(--hard); }
.pill.bad { background: color-mix(in srgb, var(--loose) 16%, transparent); color: var(--loose); }
.pill.now { background: var(--accent); color: var(--accent-ink); }

/* Plan */
.blocks { display: grid; gap: 10px; }
.blk { border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 8px; min-width: 0; }
.blk.current { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.blk-top { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
.blk-num { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.blk-portions { display: flex; gap: 6px; flex-wrap: wrap; }
.blk-portions span { font-family: var(--font-mono); font-size: 12.5px; background: var(--surface-2); padding: 3px 8px; border-radius: 8px; }
.blk select { border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; background: var(--surface); font-size: 13px; }
.foodcat { display: grid; gap: 6px; padding-block: 8px; border-bottom: 1px solid var(--line); }
.foodcat:last-child { border-bottom: 0; }
.addfood { background: var(--surface-2); border-radius: 14px; padding: 12px; display: grid; gap: 10px; }
.addfood select { border: 1px solid var(--line); border-radius: 12px; padding: 9px 10px; background: var(--surface); }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }
.chip.mine { background: var(--accent-soft); }
.chip-x { border: 0; background: transparent; color: var(--muted); padding: 0 0 0 2px; font-size: 15px; line-height: 1; }
.chip-x:hover { color: var(--loose); }
details summary { cursor: pointer; font-weight: 700; }
ol.rules { margin: 0; padding-left: 20px; display: grid; gap: 6px; color: var(--ink); }
a { color: var(--accent); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 50; background: var(--ink); color: var(--bg); border-radius: 14px; padding: 10px 10px 10px 16px; display: flex; gap: 12px; align-items: center; font-size: 14px; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.toast button { background: transparent; border: 1px solid color-mix(in srgb, var(--bg) 40%, transparent); color: var(--bg); border-radius: 10px; padding: 5px 10px; font-weight: 700; }
.login { position: fixed; inset: 0; z-index: 60; background: var(--bg); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.login form { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); padding: 24px; width: min(380px, 100%); display: grid; gap: 14px; }

/* ---------- Date helpers (local dates as YYYY-MM-DD) ---------- */
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d, 12); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
const todayIso = () => iso(new Date());
const nowHM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const hmToMin = t => { const [h, m] = (t || "0:0").split(":").map(Number); return h * 60 + m; };
const fmtLong = s => parse(s).toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
const fmtShort = s => parse(s).toLocaleDateString("en-GB", { day: "numeric", month: "short" });

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const r1 = x => Math.round(x * 10) / 10;

/* ---------- Plan schedule ---------- */
function buildSchedule(settings) {
  const start = settings.planStart || "2026-11-01";
  const extra = settings.extraRest || {};
  const map = {}; const blocks = [];
  let d = start;
  BLOCKS.forEach(b => {
    const rest = 2 + (extra[b.n] || 0);
    const info = { ...b, start: d, end: addDays(d, 2 + rest), restDays: rest };
    for (let i = 0; i < 3; i++) map[addDays(d, i)] = { kind: "challenge", block: b, day: i + 1, food: b.food, grams: b.g[i], label: b.group };
    for (let i = 0; i < rest; i++) map[addDays(d, 3 + i)] = { kind: "rest", block: b, day: i + 1, label: b.group };
    blocks.push(info);
    d = addDays(d, 3 + rest);
  });
  const bonusStart = d;
  BONUS.forEach((x, i) => {
    const day = addDays(d, i);
    map[day] = x.rest ? { kind: "final-rest", label: "Rest before the appointment" } : { kind: "bonus", food: x.food, grams: x.grams, onlyIf: x.onlyIf, label: "Bonus test", bonusIndex: i };
  });
  return { start, map, blocks, bonusStart, end: addDays(d, BONUS.length - 1) };
}

/* ---------- State and storage ---------- */
const state = {
  tab: "today",
  date: todayIso(),
  days: {},
  settings: { planStart: "2026-11-01", extraRest: {}, outcomes: {}, customFoods: [], addedFoods: [] },

  range: 14,

  editing: null,
  sheet: null,
  confirmImport: null
};
try { const t = localStorage.getItem("gutlog-tab"); if (t) state.tab = t; } catch (e) {}

const LOCAL_KEY = "gutlog-data-v1";
let db = null;

function emptyDay(date) { return { date, events: [], meals: {}, challenge: null, note: "" }; }
function getDay(date) { return state.days[date] || emptyDay(date); }

function localSave() {
  try { localStorage.setItem(LOCAL_KEY, JSON.stringify({ days: state.days, settings: state.settings })); } catch (e) {}
}
function localLoad() {
  try { const raw = localStorage.getItem(LOCAL_KEY); if (raw) { const o = JSON.parse(raw); state.days = o.days || {}; Object.assign(state.settings, o.settings || {}); } } catch (e) {}
}

/* Three places data can live: the artifact's db (inside Claude), the site's own API (on Vercel), or this browser only. */
let api = false;
const PENDING_KEY = "gutlog-pending-v1";
function pendingGet() { try { return JSON.parse(localStorage.getItem(PENDING_KEY) || "{}"); } catch (e) { return {}; } }

function markPending(key, on) { const p = pendingGet(); if (on) p[key] = 1; else delete p[key]; pendingSet(p); }

async function apiCall(method, path, body) {
  const r = await fetch(path, { method, credentials: "same-origin", headers: body ? { "Content-Type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) { showLogin(); const e = new Error("login"); e.login = true; throw e; }
  if (!r.ok) throw new Error("http " + r.status);
  return r.json();

let offlineWarned = false;
function wentOffline() {
  state.backend = "offline";

async function saveDay(day) {
  state.days[day.date] = day;

    try { await db.doc("days/" + day.date).set(day); }

    localSave(); markPending("d:" + day.date, true);
    try { await apiCall("PUT", "/api/data", { type: "day", day }); markPending("d:" + day.date, false); if (state.backend === "offline") { state.backend = "api"; render(); } }
    catch (e) { if (!e.login) wentOffline(); }
  } else localSave();
}
async function saveSettings() {
  render();

    try { await db.doc("settings/main").set(state.settings); }

  } else if (api) {

    catch (e) { if (!e.login) wentOffline(); }
  } else localSave();
}

const DEFAULT_SETTINGS = () => ({ planStart: "2026-11-01", extraRest: {}, outcomes: {}, customFoods: [], addedFoods: [] });
function applyServer(o) {
  const p = pendingGet();
  const days = { ...(o.days || {}) };
  Object.keys(p).forEach(k => { if (k.startsWith("d:")) { const d = k.slice(2); if (state.days[d]) days[d] = state.days[d]; } });
  state.days = days;
  if (!p.settings) state.settings = Object.assign(DEFAULT_SETTINGS(), o.settings || {});
  localSave();
}
async function flushPending() {
  const p = pendingGet();
  for (const k of Object.keys(p)) {
    if (k === "settings") await apiCall("PUT", "/api/data", { type: "settings", settings: state.settings });
    else if (state.days[k.slice(2)]) await apiCall("PUT", "/api/data", { type: "day", day: state.days[k.slice(2)] });
    markPending(k, false);
  }
}
function typingInView() {

  setInterval(sync, 30000);

}

function showLogin(msg) {

}
async function logout() {

async function initStorage() {

  let wasApi = false;

    try {
      const r = await fetch("/api/data", { credentials: "same-origin" });

  return {
    bloatN: bloats.length,
    bloatScore: bloats.reduce((a, e) => a + (e.v || 1), 0),
    bloatMax: bloats.reduce((a, e) => Math.max(a, e.v || 1), 0),
    burps: ev.filter(e => e.type === "burp").length,
    gas: ev.filter(e => e.type === "gas").length,
    stools: stools.map(e => e.v),
    diar: stools.filter(e => e.v >= 6).length,
    stoolTxt: stools.map(e => e.v + (e.size ? " " + SIZE_NAME[e.size] : "")),
    logged: ev.length > 0 || !!mealsLogged || !!(day && day.challenge)
  };
}

/* ---------- Reintroduction logic: driven by what you log, the plan only suggests ---------- */
function groupOf(c) { return !c ? null : c.group ? c.group : c.block ? "b" + c.block : "other"; }
function groupInfo(key) { return GROUPS.find(g => g.key === key) || GROUPS[GROUPS.length - 1]; }
function challengeLogs() {
  return Object.values(state.days).filter(d => d.challenge && d.challenge.ate)
    .map(d => ({ date: d.date, c: d.challenge, g: groupOf(d.challenge) })).sort((a, b) => a.date < b.date ? -1 : 1);
}
function resultKey(g, c) { return g.startsWith("b") ? g.slice(1) : g === "other" ? "other:" + (c.food || "").trim().toLowerCase() : g; }
function outcomeOf(key) { return (state.settings.outcomes || {})[key] || {}; }
function groupSuggestion(key, date) {
  const g = groupInfo(key);
  const n = key === "other" ? 0 : challengeLogs().filter(l => l.g === key && l.date < date).length;
  const day = g.portions.length ? Math.min(n + 1, g.portions.length) : null;
  return { group: key, food: g.food, day, grams: day ? g.portions[day - 1] : null };
}
function blockDone(n, date) {
  const cnt = challengeLogs().filter(l => l.g === "b" + n && l.date < date).length;
  return cnt >= 3 || !!outcomeOf(String(n)).result;
}
function suggestion(date) {
  const logs = challengeLogs().filter(l => l.date < date);
  const last = logs[logs.length - 1];
  if (last && last.g.startsWith("b") && !blockDone(last.g.slice(1), date) && diffDays(last.date, date) <= 2) return groupSuggestion(last.g, date);
  const next = BLOCKS.find(b => !blockDone(b.n, date));
  return groupSuggestion(next ? "b" + next.n : "other", date);
}
function restAfter(date) {
  // the last test, if it was 1 or 2 days ago and that test looks finished
  const logs = challengeLogs().filter(l => l.date < date);
  const last = logs[logs.length - 1];
  if (!last) return null;
  const gap = diffDays(last.date, date);
  if (gap < 1 || gap > 2) return null;
  return !last.g.startsWith("b") || blockDone(last.g.slice(1), date) ? last : null;
}
function gramsTxt(c) { return c && c.grams != null && c.grams !== "" ? `${c.grams} g` : ""; }
function chTitle(c) { const g = groupInfo(groupOf(c)); return `${g.block ? g.block.group : g.key === "other" ? (c.food || "other food") : g.label}${c.day ? ` day ${c.day}` : ""}`; }

/* ---------- Actions ---------- */
function mealForTime(t) { const m = hmToMin(t); return m < 660 ? "breakfast" : m < 990 ? "lunch" : m < 1170 ? "snack" : "dinner"; }
// Snacks are stored one per entry under keys "snack" (older entries) or "snack:<id>", each with its own time.
const isSnack = k => !!k && (k === "snack" || k.startsWith("snack:"));
function mealDef(k) { return MEALS.find(x => x.k === (isSnack(k) ? "snack" : k)) || MEALS[1]; }
function mealLabel(k) { return isSnack(k) ? "Snack" : mealDef(k).label; }
function mealEntries(day) {
  return Object.entries((day && day.meals) || {}).filter(([, m]) => m && (m.foods || []).length)
    .map(([k, m]) => ({ k, m, t: m.time || mealDef(k).def, label: mealLabel(k) }))
    .sort((a, b) => hmToMin(a.t) - hmToMin(b.t));
}
function chMeal(c) { return (c && c.meal) || "lunch"; }
function logEvent(type, v) {
  const day = structuredClone(getDay(state.date));
  const ev = { id: uid(), t: nowHM(), type };
  if (v != null) ev.v = v;
  day.events.push(ev);
  day.events.sort((a, b) => hmToMin(a.t) - hmToMin(b.t));
  saveDay(day);
  const name = type === "stool" ? `Bristol type ${v}` : type === "bloat" ? `${SEV[v]} bloating` : SYM[type].label;
  toast(`${name} logged at ${ev.t}`, () => {
    const d2 = structuredClone(getDay(state.date));
    d2.events = d2.events.filter(e => e.id !== ev.id);
    saveDay(d2);
  });
}
function deleteEvent(id) {
  const day = structuredClone(getDay(state.date));
  day.events = day.events.filter(e => e.id !== id);
  state.editing = null;
  saveDay(day);
}
function setEventTime(id, t) {
  const day = structuredClone(getDay(state.date));
  const e = day.events.find(x => x.id === id); if (!e || !t) return;
  e.t = t; day.events.sort((a, b) => hmToMin(a.t) - hmToMin(b.t));
  saveDay(day);
}


/* ---------- Toast ---------- */
let toastTimer = null;
function toast(msg, undo) {
  const host = document.getElementById("toastHost");
  host.innerHTML = `<div class="toast" role="status"><span>${esc(msg)}</span>${undo ? '<button id="undoBtn">Undo</button>' : ""}</div>`;
  if (undo) document.getElementById("undoBtn").onclick = () => { host.innerHTML = ""; undo(); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { host.innerHTML = ""; }, 4500);
}

  document.getElementById("dayTitle").textContent = diff === 0 ? "Today" : diff === -1 ? "Yesterday" : fmtLong(state.date);
  document.getElementById("daySub").textContent = diff === 0 || diff === -1 ? fmtLong(state.date) : (diff < 0 ? `${-diff} days ago` : `In ${diff} days`);
  document.getElementById("nextDay").disabled = state.date >= t;
  document.getElementById("todayBtn").hidden = state.date === t;

  pill.className = "phase";

      <span class="btn small primary" aria-hidden="true">Mark</span></button>`;
  const body = `

    ${!q && prevMeal && (prevMeal.foods || []).length ? `<button class="btn small" id="copyPrev">Same as yesterday's ${mm.label.toLowerCase()}</button>` : ""}

    ${cats.map(c => `<div class="picker-cat"><span class="eyebrow">${esc(c.cat)}</span>${c.note && !q ? `<span class="hint">${esc(c.note)}</span>` : ""}<div class="chips">${c.items.map(pick).join("")}</div></div>`).join("")}
    ${q && !cats.length && !customMatch.length ? `<div class="empty">"${esc(s.q)}" is not on your low FODMAP list. Add it below if you ate it anyway.</div>` : ""}
    <div class="legend-fl"><span><i style="background:var(--hist)"></i>Histamine, in moderation</span><span><i style="background:var(--gluc)"></i>Glucose spike, in moderation</span></div>`;
  host.innerHTML = `<div class="scrim" id="scrim"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-head"><span class="grab"></span>
        <div class="row" style="justify-content:space-between"><h2 id="sheetTitle">${mm.label}</h2>
          <label class="row hint" for="mealTime">Time <input type="time" id="mealTime" class="field mono" style="width:110px;padding:6px 8px" value="${esc(s.time)}"></label></div>
        <input class="field" id="foodSearch" type="search" placeholder="Search foods" value="${esc(s.q)}" autocomplete="off">
      </div>
      <div class="sheet-body" id="sheetBody">${body}</div>
      <div class="sheet-foot">
        <div class="row" style="flex-wrap:nowrap"><input class="field" id="customFood" placeholder="Something else? Type it and press Add" autocomplete="off"><button class="btn" id="addCustom">Add</button></div>
        <input class="field" id="mealNote" placeholder="Note (portion, restaurant, how it was cooked)" value="${esc(s.note)}">
        <div class="row" style="justify-content:space-between">${s.foods.length || ((getDay(state.date).meals || {})[s.k]) ? `<button class="btn ghost danger" id="clearMeal">${isSnack(s.k) ? "Delete snack" : "Clear meal"}</button>` : "<span></span>"}<button class="btn primary" id="saveMeal">Save ${mm.label.toLowerCase()}</button></div>
      </div>

}
function closeSheet() { state.sheet = null; state.stool = null; renderSheet(); }

/* ---------- Stool sheet: type, size and comments ---------- */
function openStool(v, id) {
  const ev = id ? (getDay(state.date).events || []).find(e => e.id === id) : null;
  state.stool = { id: ev ? ev.id : null, v: ev ? ev.v : v, size: ev ? ev.size || "" : "", note: ev ? ev.note || "" : "", t: ev ? ev.t : nowHM() };
  state.editing = null;
  renderStool();
}
function renderStool() {
  const host = document.getElementById("overlay");
  const s = state.stool;
  if (!s) { host.innerHTML = ""; document.body.style.overflow = ""; return; }
  document.body.style.overflow = "hidden";
  const b = BRISTOL[s.v - 1];
  host.innerHTML = `<div class="scrim" id="scrim"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="stTitle">
      <div class="sheet-head"><span class="grab"></span>

      </div>
      <div class="sheet-body">
        <div class="bristol">${BRISTOL.map(x => `<button class="bbtn ${x.n === s.v ? "on" : ""}" data-stv="${x.n}" aria-label="Bristol type ${x.n}, ${x.label}" aria-pressed="${x.n === s.v}">${bristolSvg(x.n)}<span class="n">${x.n}</span><span class="band" style="background:var(--${x.band})"></span></button>`).join("")}</div>
        <div class="picker-cat"><span class="eyebrow">Size</span>
          <div class="sizes">${SIZES.map(([k, l, px]) => `<button class="size ${s.size === k ? "on" : ""}" data-size="${k}" aria-pressed="${s.size === k}"><i style="width:${px}px;height:${px}px"></i>${l}</button>`).join("")}</div></div>
        <div class="picker-cat"><label class="eyebrow" for="stNote">Comments</label>
          <textarea class="note" id="stNote" placeholder="Urgency, pain, mucus, colour, feeling of incomplete emptying">${esc(s.note)}</textarea></div>
      </div>

        <button class="btn primary" id="stSave">${s.id ? "Save changes" : "Log it"}</button></div></div>
    </div>`;
}
function saveStool() {
  const s = state.stool; if (!s) return;
  const day = structuredClone(getDay(state.date));
  const t = s.t || nowHM();
  let e = s.id ? day.events.find(x => x.id === s.id) : null;
  if (!e) { e = { id: uid(), type: "stool" }; day.events.push(e); }
  e.v = s.v; e.t = t;
  if (s.size) e.size = s.size; else delete e.size;
  if (s.note.trim()) e.note = s.note.trim(); else delete e.note;
  day.events.sort((a, b) => hmToMin(a.t) - hmToMin(b.t));
  const isNew = !s.id;
  closeSheet();
  saveDay(day);
  toast(isNew ? `Bristol ${s.v}${s.size ? ", " + SIZE_NAME[s.size] : ""} logged at ${t}` : "Changes saved");
}
function saveMeal(clear) {
  const s = state.sheet;
  const day = structuredClone(getDay(state.date));
  day.meals = day.meals || {};
  if (clear || !s.foods.length) delete day.meals[s.k];
  else day.meals[s.k] = { foods: s.foods, time: s.time, note: s.note };
  const wasHere = day.challenge && day.challenge.ate && chMeal(day.challenge) === s.k;
  if (s.ch && !clear) {
    const g = groupInfo(s.chg.group);
    const grams = s.chg.grams === "" || s.chg.grams == null || isNaN(Number(s.chg.grams)) ? null : Number(s.chg.grams);
    day.challenge = { ate: true, t: s.time, meal: s.k, group: g.key, block: g.block ? g.block.n : null,
      food: (s.chg.food || g.food || "Test food").trim(), day: s.chg.day || null, grams,
      planned: s.chg.day && g.portions[s.chg.day - 1] != null ? g.portions[s.chg.day - 1] : null };
  } else if (wasHere) day.challenge = null;
  closeSheet();
  saveDay(day);
}

/* ---------- Insights ---------- */
function rangeDates(n) { const t = todayIso(); return Array.from({ length: n }, (_, i) => addDays(t, i - n + 1)); }

function baseline(sched, beforeDate) {
  // average of the 7 most recent logged non-challenge days before a date
  const vals = [];
  for (let i = 1; i <= 30 && vals.length < 7; i++) {
    const d = addDays(beforeDate, -i);
    if (state.days[d] && state.days[d].challenge && state.days[d].challenge.ate) continue;
    const m = metrics(state.days[d]);
    if (m.logged) vals.push(m);
  }
  if (!vals.length) return null;
  const avg = k => vals.reduce((a, m) => a + m[k], 0) / vals.length;
  return { n: vals.length, bloatScore: avg("bloatScore"), burps: avg("burps"), gas: avg("gas"), diar: avg("diar"), stoolsPerDay: vals.reduce((a, m) => a + m.stools.length, 0) / vals.length };
}

function renderInsights(sched) {
  const dates = rangeDates(state.range);
  const ms = dates.map(d => metrics(state.days[d]));
  const logged = ms.filter(m => m.logged);
  const n = logged.length || 1;
  const allStools = logged.flatMap(m => m.stools);
  const ideal = allStools.filter(v => v >= 3 && v <= 5).length;
  const tile = (label, color, v, s) => `<div class="tile"><span class="l">${color ? `<span class="swatch" style="background:${color}"></span>` : ""}${label}</span><span class="v">${v}</span><span class="s">${s}</span></div>`;
  const seg = `<div class="seg" role="group" aria-label="Time range">${[7, 14, 30].map(r => `<button data-range="${r}" aria-pressed="${state.range === r}">${r} days</button>`).join("")}</div>`;

  if (!logged.length) {
    return `<div class="sec-head"><h2>Insights</h2>${seg}</div>
      <div class="empty" style="background:var(--surface)">No entries in the last ${state.range} days yet. Charts and stats appear here once you start logging symptoms and meals in the Log tab.</div>
      ${reintroSection(sched)}`;
  }
  return `<div class="sec-head"><h2>Insights</h2>${seg}</div>
    <p class="hint">Averages over the ${logged.length} day${logged.length === 1 ? "" : "s"} you logged in the last ${state.range}.</p>
    <div class="tiles">
      ${tile("Bowel movements", "", r1(allStools.length / n), allStools.length ? `per day · ${Math.round(ideal / allStools.length * 100)}% ideal (type 3-5)` : "per day")}
      ${tile("Bloating", "var(--bloat)", r1(logged.reduce((a, m) => a + m.bloatN, 0) / n), "episodes per day")}
      ${tile("Burps", "var(--burp)", r1(logged.reduce((a, m) => a + m.burps, 0) / n), "per day")}
      ${tile("Gas", "var(--gas)", r1(logged.reduce((a, m) => a + m.gas, 0) / n), "per day")}
    </div>
    <section class="card"><div class="sec-head"><h2>Day by day</h2></div>
      <div class="legend"><span><span class="swatch" style="background:var(--accent);border-radius:2px;transform:rotate(45deg)"></span>Reintroduction day</span><span><span class="swatch" style="background:var(--ideal)"></span>Stool 3-5</span><span><span class="swatch" style="background:var(--hard)"></span>1-2</span><span><span class="swatch" style="background:var(--loose)"></span>6-7</span></div>
      <div class="chartbox" id="dailyChart" data-dates="${dates.join(",")}"></div>
    </section>
    ${reintroSection(sched)}
    <section class="card"><div class="sec-head"><h2>Time of day</h2><span class="hint">When symptoms happen, all logged days in range</span></div>
      <div class="legend"><span><span class="swatch" style="background:var(--bloat)"></span>Bloating</span><span><span class="swatch" style="background:var(--burp)"></span>Burps</span><span><span class="swatch" style="background:var(--gas)"></span>Gas</span><span><span class="swatch" style="background:var(--diar)"></span>Diarrhea (type 6-7)</span></div>
      <div class="chartbox" id="hourChart" data-dates="${dates.join(",")}"></div>
    </section>
    <section class="card"><div class="sec-head"><h2>When you go</h2><span class="hint">Bowel movements by hour, all logged days in range</span></div>
      <p class="hint" id="stoolPeak"></p>
      <div class="legend"><span><span class="swatch" style="background:var(--ideal)"></span>Type 3-5</span><span><span class="swatch" style="background:var(--hard)"></span>Type 1-2</span><span><span class="swatch" style="background:var(--loose)"></span>Type 6-7</span></div>
      <div class="chartbox" id="stoolHourChart" data-dates="${dates.join(",")}"></div>
    </section>
    <section class="card"><div class="sec-head"><h2>Meals and symptoms</h2><span class="hint">Last 7 days on a 24-hour line</span></div>
      <div class="legend"><span><span class="swatch" style="background:var(--muted);border-radius:2px"></span>Meal</span><span><span class="swatch" style="background:var(--accent);border-radius:2px;transform:rotate(45deg)"></span>Challenge food</span><span><span class="swatch" style="background:var(--bloat)"></span>Bloating</span><span><span class="swatch" style="background:var(--burp)"></span>Burps</span><span><span class="swatch" style="background:var(--gas)"></span>Gas</span><span><span class="swatch" style="background:var(--diar)"></span>Diarrhea</span></div>
      <div class="chartbox" id="dayLines"></div>
    </section>`;
}

function reintroSection(sched) {
  const t = todayIso();
  const logs = challengeLogs().filter(l => l.date <= t);
  if (!logs.length) {
    return `<section class="card"><div class="sec-head"><h2>Reintroduction results</h2></div>
      <p class="hint">Mark a meal as a reintroduction and the results show up here: the food and portion next to your bloating, burps, gas and stools, compared with your usual on low FODMAP days. Your plan suggests starting on ${fmtLong(sched.start)}.</p></section>`;
  }
  const order = [], by = {};
  logs.forEach(l => { const k = resultKey(l.g, l.c); if (!by[k]) { by[k] = []; order.push(k); } by[k].push(l); });
  const testDates = new Set(logs.map(l => l.date));
  const flag = (v, bv) => bv != null && v > 0 && v >= Math.max(bv * 1.5, bv + 1);
  const out = order.map(k => {
    const ls = by[k]; const g = groupInfo(ls[0].g);
    const lastD = ls[ls.length - 1].date;
    const base = baseline(sched, ls[0].date);
    const rows = ls.map(l => ({ d: l.date, l }));
    for (let i = 1; i <= 2; i++) { const d = addDays(lastD, i); if (d > t || testDates.has(d)) break; rows.push({ d, l: null }); }
    const body = rows.map(({ d, l }) => {
      const day = state.days[d]; const m = metrics(day);
      let lag = "", ctx = "";
      if (l) {
        const c0 = hmToMin(l.c.t);
        const first = (day.events || []).filter(e => e.type !== "stool" && hmToMin(e.t) >= c0).sort((a, b) => hmToMin(a.t) - hmToMin(b.t))[0];
        lag = first ? `${r1((hmToMin(first.t) - c0) / 60)} h` : "none";
        const plate = ((day.meals || {})[chMeal(l.c)] || {}).foods;
        ctx = `<br><small class="hint">${esc(l.c.food)} · ${mealLabel(chMeal(l.c))} ${esc(l.c.t)}${plate && plate.length ? ` with ${esc(plate.join(", "))}` : ""}${l.c.planned != null && l.c.grams != null && Number(l.c.grams) !== Number(l.c.planned) ? ` · plan was ${l.c.planned} g` : ""}</small>`;
      }
      const cell = (v, bv) => `<td class="num">${flag(v, bv) ? `<span class="hi">${v}</span>` : v}</td>`;
      const label = l ? `${l.c.day ? `Day ${l.c.day}` : "Test"}${gramsTxt(l.c) ? ` · <span class="mono">${esc(gramsTxt(l.c))}</span>` : ""}` : "After";
      return `<tr><td>${label}<br><small class="hint">${fmtDow(d)} ${fmtShort(d)}</small>${ctx}</td>
        ${cell(m.bloatScore, base && base.bloatScore)}${cell(m.burps, base && base.burps)}${cell(m.gas, base && base.gas)}${cell(m.diar, base && base.diar)}<td class="num">${m.stoolTxt.length ? m.stoolTxt.join(", ") : "-"}</td><td class="num">${lag}</td></tr>`;
    }).join("");
    const o = outcomeOf(k);
    const recent = diffDays(lastD, t) <= 2;
    const pill = o.result === "tolerated" ? '<span class="pill good">Tolerated</span>' : o.result === "partial" ? '<span class="pill mid">Partial</span>' : o.result === "not" ? '<span class="pill bad">Not tolerated</span>' : recent ? '<span class="pill now">In progress</span>' : '<span class="pill">Result not set</span>';
    const title = g.block ? `${esc(g.block.group)} · ${esc([...new Set(ls.map(l => l.c.food))].join(", "))}` : g.key === "other" ? esc(ls[0].c.food) : esc(g.label);
    return `<div class="block-res">
      <div class="row" style="justify-content:space-between"><div><span class="blk-num">${g.block ? `Block ${g.block.n}` : g.key === "other" ? "Other food" : "Bonus"} · from ${fmtShort(ls[0].date)}</span><h3>${title}</h3></div>${pill}</div>
      <div class="tablewrap"><table class="rt"><thead><tr><th>Day</th><th>Bloating score</th><th>Burps</th><th>Gas</th><th>Diarrhea</th><th>Stools (Bristol)</th><th>First symptom after food</th></tr></thead><tbody>${body}</tbody></table></div>
      <p class="hint">${base ? `Your usual (${base.n} low FODMAP days before): bloating score ${r1(base.bloatScore)}, burps ${r1(base.burps)}, gas ${r1(base.gas)}, diarrhea ${r1(base.diar)}, ${r1(base.stoolsPerDay)} stools a day. <span class="hi">Highlighted</span> values are clearly above that.` : "Log a few low FODMAP days before a test to get a baseline to compare against."}</p>
    </div>`;
  }).join("");
  return `<section class="card"><div class="sec-head"><h2>Reintroduction results</h2><a href="${PLAN_DOC}" target="_blank" rel="noopener">Open plan doc</a></div>
    <p class="hint">Each test shows the days you ate the food plus up to 2 days after. Bloating score adds up severity (mild 1, moderate 2, strong 3). Set block results in the Plan tab.</p>${out}</section>`;
}

/* ---------- Charts ---------- */
function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function attachTips(box) {
  let tip = box.querySelector(".tip");
  if (!tip) { tip = document.createElement("div"); tip.className = "tip"; tip.hidden = true; box.appendChild(tip); }
  box.querySelectorAll("[data-tip]").forEach(el => {
    const show = ev => {
      tip.innerHTML = el.getAttribute("data-tip"); tip.hidden = false;
      const br = box.getBoundingClientRect();
      const x = (ev.clientX ?? (el.getBoundingClientRect().left + 10)) - br.left + box.scrollLeft;
      const y = (ev.clientY ?? el.getBoundingClientRect().top) - br.top;
      const w = tip.offsetWidth;
      tip.style.left = Math.max(4, Math.min(x + 12, box.scrollWidth - w - 4)) + "px";
      tip.style.top = Math.max(4, y - tip.offsetHeight - 10) + "px";
    };
    el.addEventListener("pointermove", show);
    el.addEventListener("pointerenter", show);
    el.addEventListener("pointerleave", () => { tip.hidden = true; });
    el.addEventListener("focus", show);
    el.addEventListener("blur", () => { tip.hidden = true; });
  });
}

function drawDaily(sched) {
  const box = document.getElementById("dailyChart"); if (!box) return;
  const dates = box.dataset.dates.split(",");
  const W = Math.max(box.clientWidth, dates.length * 18 + 90);
  const left = 78, right = 8, top = 22;
  const rowH = 42, gap = 10, axisH = 30;
  const rows = [{ k: "bloatScore", label: "Bloating", c: "var(--bloat)" }, { k: "burps", label: "Burps", c: "var(--burp)" }, { k: "gas", label: "Gas", c: "var(--gas)" }, { k: "diar", label: "Diarrhea", c: "var(--diar)" }];
  const cw = (W - left - right) / dates.length;
  const dotR = Math.min(5, cw / 3), dotStep = dotR * 2 + 2;
  const maxStools = Math.max(1, ...dates.map(d => metrics(state.days[d]).stools.length));
  const stoolH = Math.max(34, 8 + maxStools * dotStep + 6);
  const H = top + rows.length * (rowH + gap) + stoolH + axisH;
  const bw = Math.max(4, Math.min(18, cw - 4));
  const ms = dates.map(d => metrics(state.days[d]));
  let svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily symptoms chart">`;
  // challenge bands
  dates.forEach((d, i) => {
    const dd = state.days[d];
    if (dd && dd.challenge && dd.challenge.ate) {
      const x = left + i * cw;
      svg += `<rect x="${x + 1}" y="${top - 6}" width="${cw - 2}" height="${H - top - axisH + 6}" rx="4" fill="var(--accent-soft)"/>`;
      svg += `<rect x="${x + cw / 2 - 4}" y="${top - 18}" width="8" height="8" transform="rotate(45 ${x + cw / 2} ${top - 14})" fill="var(--accent)"/>`;
    }
  });
  rows.forEach((r, ri) => {
    const y0 = top + ri * (rowH + gap);
    const max = Math.max(1, ...ms.map(m => m[r.k]));
    svg += `<text x="0" y="${y0 + rowH - 4}" font-size="12" fill="var(--muted)">${r.label}</text>`;
    svg += `<text x="${left - 8}" y="${y0 + 9}" font-size="10" text-anchor="end" fill="var(--muted)">${max}</text>`;
    svg += `<line x1="${left}" x2="${W - right}" y1="${y0 + rowH}" y2="${y0 + rowH}" stroke="var(--line)"/>`;
    ms.forEach((m, i) => {
      const v = m[r.k]; const x = left + i * cw + (cw - bw) / 2;
      const h = v ? Math.max(3, (v / max) * (rowH - 4)) : 0;
      const tipTxt = `<strong>${fmtDow(dates[i])} ${fmtShort(dates[i])}</strong><br>${r.label}: ${v}${r.k === "bloatScore" ? ` (score, ${m.bloatN} episode${m.bloatN === 1 ? "" : "s"})` : ""}`;
      if (h) svg += `<path d="M${x},${y0 + rowH} v${-(h - 4)} q0,-4 4,-4 h${bw - 8} q4,0 4,4 v${h - 4} z" fill="${r.c}"/>`;
      svg += `<rect x="${left + i * cw}" y="${y0}" width="${cw}" height="${rowH}" fill="transparent" data-tip="${esc(tipTxt)}" tabindex="-1"/>`;
    });
  });
  // stool row
  const ys = top + rows.length * (rowH + gap);
  svg += `<text x="0" y="${ys + 18}" font-size="12" fill="var(--muted)">Stools</text>`;
  ms.forEach((m, i) => {
    const cx = left + i * cw + cw / 2;
    const k = m.stools.length;
    m.stools.forEach((v, j) => {
      const band = BRISTOL[v - 1].band;
      const r = dotR;
      const cy = ys + 8 + j * dotStep;
      svg += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--${band})" stroke="var(--surface)" stroke-width="1.5"/>`;
    });
    const tipTxt = `<strong>${fmtDow(dates[i])} ${fmtShort(dates[i])}</strong><br>${k ? `Stools: ${m.stoolTxt.map(v => "type " + v).join(", ")}` : "No bowel movement logged"}`;
    svg += `<rect x="${left + i * cw}" y="${ys}" width="${cw}" height="${stoolH}" fill="transparent" data-tip="${esc(tipTxt)}"/>`;
  });
  // x axis labels
  const every = Math.max(1, Math.ceil(48 / cw));
  dates.forEach((d, i) => {
    if ((dates.length - 1 - i) % every) return;
    svg += `<text x="${left + i * cw + cw / 2}" y="${H - 6}" font-size="10.5" text-anchor="middle" fill="var(--muted)">${d === todayIso() ? "Today" : fmtShort(d)}</text>`;
  });
  svg += "</svg>";
  box.innerHTML = svg;
  attachTips(box);
}

function drawHourStack(box, counts, series, tipFn, label) {
  const W = Math.max(box.clientWidth, 360), H = 150, left = 26, right = 6, top = 10, bottom = 22;
  const cw = (W - left - right) / 24, bw = Math.max(4, cw - 3);
  const max = Math.max(1, ...counts.map(c => series.reduce((a, [k]) => a + c[k], 0)));
  const ph = H - top - bottom;
  let svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${label}">`;
  [0.5, 1].forEach(f => { const y = top + ph - f * ph; svg += `<line x1="${left}" x2="${W - right}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-dasharray="2 3"/><text x="${left - 5}" y="${y + 3}" font-size="10" text-anchor="end" fill="var(--muted)">${r1(max * f)}</text>`; });
  svg += `<line x1="${left}" x2="${W - right}" y1="${top + ph}" y2="${top + ph}" stroke="var(--line)"/>`;
  counts.forEach((c, h) => {
    const x = left + h * cw + (cw - bw) / 2;
    let y = top + ph;
    const segs = series.filter(([k]) => c[k]);
    segs.forEach(([k, col], si) => {
      const hgt = (c[k] / max) * ph;
      const isTop = si === segs.length - 1;
      const hh = Math.max(1, hgt - (si ? 2 : 0));
      if (isTop && hh > 4) svg += `<path d="M${x},${y} v${-(hh - 3)} q0,-3 3,-3 h${bw - 6} q3,0 3,3 v${hh - 3} z" fill="${col}"/>`;
      else svg += `<rect x="${x}" y="${y - hh}" width="${bw}" height="${hh}" fill="${col}"/>`;
      y -= hgt;
    });
    svg += `<rect x="${left + h * cw}" y="${top}" width="${cw}" height="${ph}" fill="transparent" data-tip="${esc(`<strong>${pad(h)}:00 to ${pad((h + 1) % 24)}:00</strong><br>${tipFn(c)}`)}"/>`;
    if (h % 3 === 0) svg += `<text x="${left + h * cw + cw / 2}" y="${H - 6}" font-size="10.5" text-anchor="middle" fill="var(--muted)">${pad(h)}h</text>`;
  });
  box.innerHTML = svg + "</svg>";
  attachTips(box);
}

function drawHours() {
  const box = document.getElementById("hourChart"); if (!box) return;
  const counts = Array.from({ length: 24 }, () => ({ bloat: 0, burp: 0, gas: 0, diar: 0 }));
  box.dataset.dates.split(",").forEach(d => ((state.days[d] || {}).events || []).forEach(e => {
    const k = e.type === "stool" ? (e.v >= 6 ? "diar" : null) : e.type;
    if (k && counts[0][k] !== undefined) counts[Math.floor(hmToMin(e.t) / 60) % 24][k]++;
  }));
  drawHourStack(box, counts, [["bloat", "var(--bloat)"], ["burp", "var(--burp)"], ["gas", "var(--gas)"], ["diar", "var(--diar)"]], c => `Bloating ${c.bloat} · Burps ${c.burp} · Gas ${c.gas} · Diarrhea ${c.diar}`, "Symptoms by hour of day");
}

function drawStoolHours() {
  const box = document.getElementById("stoolHourChart"); if (!box) return;
  const counts = Array.from({ length: 24 }, () => ({ hard: 0, ideal: 0, loose: 0 }));
  let n = 0;
  box.dataset.dates.split(",").forEach(d => ((state.days[d] || {}).events || []).forEach(e => {
    if (e.type !== "stool") return;
    counts[Math.floor(hmToMin(e.t) / 60) % 24][BRISTOL[e.v - 1].band]++; n++;
  }));
  drawHourStack(box, counts, [["ideal", "var(--ideal)"], ["hard", "var(--hard)"], ["loose", "var(--loose)"]], c => `${c.ideal + c.hard + c.loose} bowel movement${c.ideal + c.hard + c.loose === 1 ? "" : "s"}<br>Type 3-5: ${c.ideal} · 1-2: ${c.hard} · 6-7: ${c.loose}`, "Bowel movements by hour of day");
  const peak = document.getElementById("stoolPeak"); if (!peak) return;
  if (n < 5) { peak.textContent = n ? `${n} logged so far. The pattern gets clearer after a week or two of logging.` : "No bowel movements logged in this range yet."; return; }
  const tot = counts.map(c => c.ideal + c.hard + c.loose);
  let best = 0, bh = 0;
  for (let h = 0; h < 24; h++) { const v = tot[h] + tot[(h + 1) % 24]; if (v > best) { best = v; bh = h; } }
  peak.innerHTML = `Most often between <strong>${pad(bh)}:00 and ${pad((bh + 2) % 24)}:00</strong>: ${best} of ${n} (${Math.round(best / n * 100)}%).`;
}

function drawDayLines() {
  const box = document.getElementById("dayLines"); if (!box) return;
  const dates = rangeDates(7).reverse();
  const W = Math.max(box.clientWidth, 360), left = 62, right = 10, rowH = 36, top = 6, axisH = 22;
  const H = top + dates.length * rowH + axisH;
  const x = m => left + (m / 1440) * (W - left - right);
  let svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Meals and symptoms per day">`;
  [0, 6, 12, 18, 24].forEach(h => { svg += `<line x1="${x(h * 60)}" x2="${x(h * 60)}" y1="${top}" y2="${H - axisH}" stroke="var(--line)" stroke-dasharray="2 3"/><text x="${x(h * 60)}" y="${H - 6}" font-size="10.5" text-anchor="middle" fill="var(--muted)">${pad(h % 24)}:00</text>`; });
  dates.forEach((d, i) => {
    const y = top + i * rowH + rowH / 2;
    const day = state.days[d] || emptyDay(d);
    svg += `<text x="0" y="${y + 4}" font-size="11.5" fill="var(--muted)">${d === todayIso() ? "Today" : fmtDow(d) + " " + parse(d).getDate()}</text>`;
    svg += `<line x1="${left}" x2="${W - right}" y1="${y}" y2="${y}" stroke="var(--line)"/>`;
    mealEntries(day).forEach(({ m, t, label }) => {
      const cx = x(hmToMin(t));
      svg += `<rect x="${cx - 6}" y="${y - 6}" width="12" height="12" rx="3" fill="var(--surface)" stroke="var(--muted)" stroke-width="2" data-tip="${esc(`<strong>${label} ${t}</strong><br>${esc(m.foods.join(", "))}`)}"/>`; });
    if (day.challenge && day.challenge.ate) { const cx = x(hmToMin(day.challenge.t));
      svg += `<rect x="${cx - 6}" y="${y - 6}" width="12" height="12" transform="rotate(45 ${cx} ${y})" fill="var(--accent)" stroke="var(--surface)" stroke-width="2" data-tip="${esc(`<strong>Reintroduction ${day.challenge.t}</strong><br>${esc(day.challenge.food)} ${esc(gramsTxt(day.challenge))}`)}"/>`; }
    (day.events || []).forEach(e => {
      if (e.type === "stool") {
        if (e.v < 6) return;
        const cx = x(hmToMin(e.t));
        svg += `<circle cx="${cx}" cy="${y}" r="5" fill="var(--diar)" stroke="var(--surface)" stroke-width="2" data-tip="${esc(`<strong>${e.t}</strong><br>Diarrhea, Bristol ${e.v}`)}"/>`;
        return;
      }
      const cx = x(hmToMin(e.t)); const r = e.type === "bloat" ? 4 + (e.v || 1) : 4.5;
      const col = SYM[e.type].color;
      const lbl = e.type === "bloat" ? `${SEV[e.v || 1]} bloating` : SYM[e.type].label;
      svg += `<circle cx="${cx}" cy="${y}" r="${r}" fill="${col}" stroke="var(--surface)" stroke-width="2" data-tip="${esc(`<strong>${e.t}</strong><br>${lbl}`)}"/>`;
    });
  });
  svg += "</svg>";
  box.innerHTML = svg;
  attachTips(box);
}

function renderPlan(sched) {
  const t = todayIso();
  const outcomes = state.settings.outcomes || {};
  const blocks = sched.blocks.map(b => {
    const o = outcomes[b.n] || {};
    const ls = challengeLogs().filter(l => l.g === "b" + b.n);
    const next = suggestion(addDays(t, 1)).group === "b" + b.n;
    const cur = ls.length > 0 && ls.length < 3 && !o.result;
    const status = o.result || ls.length >= 3 ? "Done" : ls.length ? "In progress" : next ? "Up next" : "Not started";
    return `<div class="blk ${cur ? "current" : ""}">
      <div class="blk-top"><div><span class="blk-num">Block ${b.n} · suggested ${fmtShort(b.start)} to ${fmtShort(addDays(b.start, 2))}</span><h3>${esc(b.group)}</h3><span class="hint">${esc(b.food)}</span></div>
        <span class="pill ${cur || status === "Up next" ? "now" : status === "Done" ? "good" : ""}">${status}</span></div>
      <div class="blk-portions">${b.g.map((g, i) => `<span>Day ${i + 1} · ${g} g</span>`).join("")}</div>
      <p class="hint">${ls.length ? `Logged: ${ls.map(l => `${fmtShort(l.date)}${gramsTxt(l.c) ? " " + gramsTxt(l.c) : ""}`).join(" · ")}` : "Nothing logged yet"}</p>
      <div class="row">
        <label class="hint" for="res-${b.n}">Result</label>
        <select id="res-${b.n}" data-outcome="${b.n}">
          <option value="">Not set</option>
          <option value="tolerated" ${o.result === "tolerated" ? "selected" : ""}>Tolerated</option>
          <option value="partial" ${o.result === "partial" ? "selected" : ""}>Partial tolerance</option>
          <option value="not" ${o.result === "not" ? "selected" : ""}>Not tolerated</option>
        </select>
        <label class="hint" for="por-${b.n}">Last portion tolerated</label>
        <select id="por-${b.n}" data-portion="${b.n}">
          <option value="">-</option>${["none", ...b.g].map(g => `<option value="${g}" ${String(o.portion) === String(g) ? "selected" : ""}>${g === "none" ? "None" : g + " g"}</option>`).join("")}
        </select>
      </div>
    </div>`;
  }).join("");
  const bonus = BONUS.map((x, i) => {
    const d = addDays(sched.bonusStart, i);
    return `<tr><td>${fmtShort(d)}</td><td>${x.rest ? "Rest day" : esc(x.food)}</td><td class="num">${x.rest ? "" : x.grams + " g"}</td><td>${x.rest ? "Strict low FODMAP before the appointment" : esc(x.onlyIf)}</td></tr>`;
  }).join("");
  return `<div class="sec-head"><h2>Reintroduction plan</h2><a href="${PLAN_DOC}" target="_blank" rel="noopener">Open full plan</a></div>
    <section class="card">
      <p>Each block is 3 challenge days with increasing portions, then at least 2 rest days on strict low FODMAP. Eat the challenge food once a day, ideally at lunch.</p>
      <div class="row"><label class="hint" for="planStart">Plan starts on</label><input type="date" id="planStart" class="field mono" style="width:auto" value="${esc(sched.start)}"></div>
      <details><summary>Ground rules</summary>
        <ol class="rules" style="margin-top:8px">
          <li>Test one food at a time. Keep everything else low FODMAP and similar from day to day.</li>
          <li>Keep the probiotic dose and timing unchanged for the whole plan.</li>
          <li>Stop increasing as soon as symptoms are moderate. Go straight to rest days and note the last portion you tolerated.</li>
          <li>Rest until you are back to baseline. If that takes longer than 2 days, add a rest day here and the calendar shifts.</li>
          <li>Avoid starting a block during unusual weeks: travel, illness, exams, alcohol, a new medication.</li>
          <li>Weigh portions with a kitchen scale.</li>
        </ol>
      </details>
      <details><summary>Reading your reactions</summary>
        <div class="tablewrap" style="margin-top:8px"><table class="rt"><thead><tr><th>What happened</th><th>What it means</th><th>What to do</th></tr></thead><tbody>
          <tr><td>No symptoms up to day 3</td><td><span class="pill good">Tolerated</span></td><td>Add it back after the plan, up to the day 3 portion</td></tr>
          <tr><td>Mild symptoms on day 2 or 3</td><td><span class="pill mid">Partial</span></td><td>Use the portion from the day before as your limit</td></tr>
          <tr><td>Moderate or strong symptoms on day 1</td><td><span class="pill bad">Not tolerated</span></td><td>Avoid it and retest in 2 to 3 months</td></tr>
        </tbody></table></div>
        <p class="hint" style="margin-top:8px">Contact your doctor without waiting if you see blood in your stool, unexplained weight loss, fever, severe pain, or diarrhea that wakes you at night.</p>
      </details>
    </section>
    <div class="blocks">${blocks}</div>
    <section class="card"><div class="sec-head"><h2>Bonus tests</h2><span class="hint">Only if the groups they contain went well</span></div>
      <div class="tablewrap"><table class="rt"><thead><tr><th>Date</th><th>Food</th><th>Portion</th><th>Only if</th></tr></thead><tbody>${bonus}</tbody></table></div>
    </section>`;
}

async function exportData() {
  const data = JSON.stringify({ app: "gut-log", version: 1, exported: new Date().toISOString(), settings: state.settings, days: state.days }, null, 2);
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch (e) { dl = null; }
  if (dl) {
    try { await dl.save({ filename: `gut-log-${todayIso()}.json`, data }); toast("Backup saved"); return; } catch (e) { /* fall back to copy */ }
  }
  if (!window.claude) {
    try {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([data], { type: "application/json" }));
      a.download = `gut-log-${todayIso()}.json`; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      toast("Backup downloaded"); return;
    } catch (e) { /* fall back to copy */ }
  }
  try { await navigator.clipboard.writeText(data); toast("Backup copied to the clipboard"); }
  catch (e) { toast("Could not export from this view."); }
}
async function doImport() {
  const o = state.confirmImport; state.confirmImport = null;
  const days = o.days || {};
  if (o.settings) { state.settings = Object.assign(state.settings, o.settings); }
  Object.assign(state.days, days);
  render();
  if (db) {
    try {
      for (const [k, v] of Object.entries(days)) await db.doc("days/" + k).set(v);
      if (o.settings) await db.doc("settings/main").set(state.settings);
      toast(`Imported ${Object.keys(days).length} days`);
    } catch (e) { toast("Import stopped partway. Try again."); }
  } else if (api) {
    localSave();
    try { await apiCall("PUT", "/api/data", { type: "import", days, settings: o.settings ? state.settings : undefined }); toast(`Imported ${Object.keys(days).length} days`); }
    catch (e) { if (!e.login) toast("Import did not reach the server. Try again when online."); }
  } else { localSave(); toast(`Imported ${Object.keys(days).length} days`); }
}

/* ---------- Render and events ---------- */
function render() {
  const sched = buildSchedule(state.settings);
  renderHeader(sched);
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === state.tab)));
  const view = document.getElementById("view");
  const active = document.activeElement;
  const keepNote = active && active.id === "dayNote";
  if (keepNote) return; // do not wipe the note while typing
  view.innerHTML = state.tab === "today" ? renderToday(sched) : state.tab === "insights" ? renderInsights(sched) : state.tab === "plan" ? renderPlan(sched) : renderSettings();
  if (state.tab === "insights") { drawDaily(sched); drawHours(); drawStoolHours(); drawDayLines(); }
}

document.addEventListener("click", ev => {
  const el = ev.target.closest("button, [data-tab]");
  if (!el) { if (ev.target.id === "scrim") closeSheet(); return; }
  const d = el.dataset;
  if (d.tab) { state.tab = d.tab; try { localStorage.setItem("gutlog-tab", d.tab); } catch (e) {} render(); window.scrollTo(0, 0); return; }
  if (el.id === "prevDay") { state.date = addDays(state.date, -1); state.editing = null; render(); return; }
  if (el.id === "nextDay") { if (state.date < todayIso()) state.date = addDays(state.date, 1); state.editing = null; render(); return; }
  if (el.id === "todayBtn") { state.date = todayIso(); render(); return; }
  if (d.stool) return openStool(Number(d.stool));
  if (d.stv && state.stool) { state.stool.v = Number(d.stv); renderStool(); return; }
  if (d.size && state.stool) { state.stool.size = state.stool.size === d.size ? "" : d.size; renderStool(); return; }
  if (el.id === "stSave") return saveStool();
  if (el.id === "stCancel") return closeSheet();
  if (el.id === "stDel" && state.stool) { const id = state.stool.id; closeSheet(); return deleteEvent(id); }
  if (d.bloat) return logEvent("bloat", Number(d.bloat));
  if (d.sym) return logEvent(d.sym);
  if (d.edit) {
    const e = (getDay(state.date).events || []).find(x => x.id === d.edit);
    if (e && e.type === "stool") return openStool(e.v, e.id);
    state.editing = d.edit; render(); return;
  }
  if (d.del) return deleteEvent(d.del);
  if (el.hasAttribute("data-done")) { state.editing = null; render(); return; }
  if (el.id === "chOpen") { const k = state.date === todayIso() ? mealForTime(nowHM()) : "lunch"; return openMeal(k === "snack" ? "snack:new" : k, true); }
  if (el.id === "chUndo") { const day = structuredClone(getDay(state.date)); day.challenge = null; saveDay(day); return; }
  if (d.meal) return openMeal(d.meal);
  if (d.pick != null && state.sheet) {
    const s = state.sheet; const f = d.pick;
    s.foods = s.foods.includes(f) ? s.foods.filter(x => x !== f) : [...s.foods, f];
    const body = document.getElementById("sheetBody"); const st = body.scrollTop;
    renderSheet(); document.getElementById("sheetBody").scrollTop = st; return;
  }
  if (el.id === "copyPrev" && state.sheet) {
    const pm = ((state.days[addDays(state.date, -1)] || {}).meals || {})[state.sheet.k];
    state.sheet.foods = [...new Set([...state.sheet.foods, ...(pm.foods || [])])]; renderSheet(); return;
  }
  if (el.id === "addCustom") return addCustom();
  if (d.chday && state.sheet) { const n = Number(d.chday); state.sheet.chg = { ...state.sheet.chg, day: n, grams: groupInfo(state.sheet.chg.group).portions[n - 1] }; const st = document.getElementById("sheetBody").scrollTop; renderSheet(); document.getElementById("sheetBody").scrollTop = st; return; }
  if (el.id === "toggleCh" && state.sheet) { state.sheet.ch = !state.sheet.ch; const st = document.getElementById("sheetBody").scrollTop; renderSheet(); document.getElementById("sheetBody").scrollTop = st; return; }
  if (el.id === "saveMeal") return saveMeal(false);
  if (el.id === "clearMeal") return saveMeal(true);
  if (d.range) { state.range = Number(d.range); render(); return; }
  if (d.rest) {
    const n = d.rest; const er = { ...(state.settings.extraRest || {}) };
    er[n] = Math.max(0, (er[n] || 0) + Number(d.delta));
    state.settings = { ...state.settings, extraRest: er }; saveSettings(); return;
  }
  if (el.id === "addFoodBtn") return addFood();
  if (d.rmfood) {
    const removed = findAdded(d.rmfood); const before = addedFoods();
    state.settings = { ...state.settings, addedFoods: before.filter(a => a !== removed) }; saveSettings();
    toast(`${removed.name} removed from your list`, () => { state.settings = { ...state.settings, addedFoods: before }; saveSettings(); });
    return;
  }
  if (d.rmcustom) { state.settings = { ...state.settings, customFoods: (state.settings.customFoods || []).filter(x => x !== d.rmcustom) }; saveSettings(); return; }
  if (el.id === "exportBtn") return exportData();
  if (el.id === "logoutBtn") return logout();
  if (el.id === "importYes") return doImport();
  if (el.id === "importNo") { state.confirmImport = null; render(); return; }
});

function addFood() {
  const name = document.getElementById("newFoodName").value.trim().replace(/\s+/g, " ");
  const cat = document.getElementById("newFoodCat").value;
  const h = document.getElementById("newFoodH").checked, g = document.getElementById("newFoodG").checked;
  if (!name) { toast("Type a food name first"); document.getElementById("newFoodName").focus(); return; }
  if (onList(name)) { toast(`${name} is already on your list`); return; }
  state.lastCat = cat;
  state.settings = { ...state.settings,
    addedFoods: [...addedFoods(), { name, cat, h, g }],
    customFoods: (state.settings.customFoods || []).filter(x => x.toLowerCase() !== name.toLowerCase()) };
  saveSettings();
  toast(`${name} added to ${cat}`);
  const inp = document.getElementById("newFoodName"); if (inp) inp.focus();
}

function addCustom() {
  const inp = document.getElementById("customFood");
  const v = inp.value.trim(); if (!v || !state.sheet) return;
  if (!state.sheet.foods.includes(v)) state.sheet.foods.push(v);
  if (!onList(v) && !(state.settings.customFoods || []).includes(v)) {
    state.settings = { ...state.settings, customFoods: [...(state.settings.customFoods || []), v] };
    saveSettings();
  }
  renderSheet();
  document.getElementById("customFood").focus();
}

document.addEventListener("input", ev => {
  const t = ev.target;
  if (t.id === "foodSearch" && state.sheet) {
    state.sheet.q = t.value;
    renderSheet();
    const s = document.getElementById("foodSearch"); s.focus(); s.setSelectionRange(s.value.length, s.value.length);
  }
  if (t.id === "mealNote" && state.sheet) state.sheet.note = t.value;
  if (t.id === "stNote" && state.stool) state.stool.note = t.value;
  if (t.id === "stTime" && state.stool) state.stool.t = t.value;
  if (t.id === "mealTime" && state.sheet) state.sheet.time = t.value;
  if (t.id === "chFood" && state.sheet) state.sheet.chg.food = t.value;
  if (t.id === "chGramsIn" && state.sheet) state.sheet.chg.grams = t.value === "" ? null : Number(t.value);
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Enter" && ev.target.id === "customFood") { ev.preventDefault(); addCustom(); }
  if (ev.key === "Enter" && ev.target.id === "newFoodName") { ev.preventDefault(); addFood(); }
  if (ev.key === "Escape" && (state.sheet || state.stool)) closeSheet();
});
document.addEventListener("change", ev => {
  const t = ev.target;
  if (t.dataset.evtime) return setEventTime(t.dataset.evtime, t.value);
  if (t.id === "chGroup" && state.sheet) { state.sheet.chg = groupSuggestion(t.value, state.date); renderSheet(); return; }
  if (t.id === "chGrams") { const day = structuredClone(getDay(state.date)); if (day.challenge && t.value !== "") { day.challenge.grams = Number(t.value); saveDay(day); } return; }
  if (t.id === "chMeal") { const day = structuredClone(getDay(state.date)); if (day.challenge) { day.challenge.meal = t.value; saveDay(day); } return; }
  if (t.id === "chTime") { const day = structuredClone(getDay(state.date)); if (day.challenge && t.value) { day.challenge.t = t.value; saveDay(day); } return; }
  if (t.id === "dayNote") { const day = structuredClone(getDay(state.date)); day.note = t.value; t.blur(); saveDay(day); return; }
  if (t.id === "planStart" && t.value) { state.settings = { ...state.settings, planStart: t.value }; saveSettings(); return; }
  if (t.dataset.outcome) { const o = { ...(state.settings.outcomes || {}) }; o[t.dataset.outcome] = { ...(o[t.dataset.outcome] || {}), result: t.value }; state.settings = { ...state.settings, outcomes: o }; saveSettings(); return; }
  if (t.dataset.portion) { const o = { ...(state.settings.outcomes || {}) }; o[t.dataset.portion] = { ...(o[t.dataset.portion] || {}), portion: t.value }; state.settings = { ...state.settings, outcomes: o }; saveSettings(); return; }
  if (t.id === "importFile" && t.files && t.files[0]) {
    const fr = new FileReader();
    fr.onload = () => { try { const o = JSON.parse(fr.result); if (!o || typeof o.days !== "object") throw 0; state.confirmImport = o; render(); } catch (e) { toast("That file is not a Gut Log backup."); } };
    fr.readAsText(t.files[0]);
  }
});
document.addEventListener("focusout", ev => {
  if (ev.target.id === "dayNote") { const day = getDay(state.date); if ((day.note || "") !== ev.target.value) { const d2 = structuredClone(day); d2.note = ev.target.value; saveDay(d2); } else setTimeout(render, 0); }
});
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (state.tab === "insights") render(); }, 150); });

initStorage();
})();
</script>
