<title>Gut Log</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: phone-first single column (max 680px), sticky day header on top, tab bar fixed at the bottom like a native app. */
:root {
  --bg: #EEF3F1;
  --surface: #FFFFFF;
  --surface-2: #E4ECE9;
  --ink: #12211D;
  --muted: #5B6D67;
  --line: #D3DEDA;
  --accent: #0D6B62;
  --accent-ink: #FFFFFF;
  --accent-soft: #D6EBE6;
  --hero: #0F4F49;
  --hero-ink: #F1FAF7;
  --hero-muted: #A9CFC7;
  --bloat: #C47510;
  --burp: #B8407E;
  --gas: #2E6FD6;
  --hard: #A8621C;
  --ideal: #2E8552;
  --loose: #C23F38;
  --hist: #C62828;
  --gluc: #7B2FBE;
  --stool-ink: #6E4B33;
  --shadow: 0 1px 2px rgba(18,33,29,.06), 0 8px 24px rgba(18,33,29,.06);
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1513; --surface: #16201D; --surface-2: #1E2A27; --ink: #E4EEEA; --muted: #98ABA5; --line: #2A3834;
    --accent: #4CC0B2; --accent-ink: #062320; --accent-soft: #173A35; --hero: #123B36; --hero-ink: #EAF7F3; --hero-muted: #8FC2B8;
    --bloat: #B98029; --burp: #D0679E; --gas: #4E8BE6; --hard: #D2924F; --ideal: #5BBE85; --loose: #EC7670;
    --hist: #F07A7A; --gluc: #C18CF2; --stool-ink: #D7B79C; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1513; --surface: #16201D; --surface-2: #1E2A27; --ink: #E4EEEA; --muted: #98ABA5; --line: #2A3834;
  --accent: #4CC0B2; --accent-ink: #062320; --accent-soft: #173A35; --hero: #123B36; --hero-ink: #EAF7F3; --hero-muted: #8FC2B8;
  --bloat: #B98029; --burp: #D0679E; --gas: #4E8BE6; --hard: #D2924F; --ideal: #5BBE85; --loose: #EC7670;
  --hist: #F07A7A; --gluc: #C18CF2; --stool-ink: #D7B79C; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--hero); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.wrap { max-width: 680px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Hero header */
.hero { background: var(--hero); color: var(--hero-ink); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
.hero .wrap { padding-block: 14px 16px; display: grid; gap: 10px; }
.hero-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
.brand svg { width: 22px; height: 22px; }
.daynav { display: flex; align-items: center; gap: 4px; }
.daynav button { background: transparent; border: 1px solid color-mix(in srgb, var(--hero-ink) 25%, transparent); color: var(--hero-ink); border-radius: 999px; height: 34px; min-width: 34px; padding: 0 10px; display: grid; place-items: center; }
.daynav button:hover { background: color-mix(in srgb, var(--hero-ink) 10%, transparent); }
.daynav button:disabled { opacity: .35; cursor: default; }
.daytitle { font-family: var(--font-display); font-size: 26px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; text-wrap: balance; }
.daysub { color: var(--hero-muted); font-size: 13px; }
.phase { display: inline-flex; align-items: center; gap: 8px; background: color-mix(in srgb, var(--hero-ink) 12%, transparent); border-radius: 999px; padding: 5px 12px 5px 8px; font-size: 13px; font-weight: 700; width: fit-content; max-width: 100%; }
.phase .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--hero-muted); flex: none; }
.phase.ph-ch .dot { background: #F2C14E; }
.phase.ph-rest .dot { background: #8FD3C4; }

main { padding-block: 16px 120px; display: grid; gap: 18px; }
section.card { background: var(--surface); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); display: grid; gap: 12px; min-width: 0; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h2 { font-family: var(--font-display); font-size: 18px; font-weight: 700; margin: 0; letter-spacing: -.01em; }
h3 { font-family: var(--font-display); font-size: 15px; font-weight: 700; margin: 0; }
.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.hint { color: var(--muted); font-size: 13px; margin: 0; }
p { margin: 0; }

/* Challenge card */
.challenge { background: var(--accent-soft); border-radius: var(--r); padding: 16px; display: grid; gap: 10px; }
.challenge .big { font-family: var(--font-display); font-size: 22px; font-weight: 700; letter-spacing: -.01em; line-height: 1.15; }
.challenge .grams { font-family: var(--font-mono); font-size: 22px; color: var(--accent); }
.daydots { display: flex; gap: 6px; }
.daydots span { height: 6px; flex: 1; border-radius: 3px; background: color-mix(in srgb, var(--accent) 22%, transparent); }
.daydots span.on { background: var(--accent); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 14px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.small { padding: 6px 10px; font-size: 13px; border-radius: 10px; }
.btn.danger { color: var(--loose); }
.done-pill { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; color: var(--accent); }

/* Quick log */
.qgroup { display: grid; gap: 8px; }
.bristol { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.bbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 8px 2px 6px; display: grid; justify-items: center; gap: 2px; min-height: 84px; transition: transform .08s ease, background .15s; }
.bbtn:hover { background: var(--surface-2); }
.bbtn:active { transform: scale(.95); }
.bbtn svg { width: 100%; max-width: 46px; height: 30px; color: var(--stool-ink); }
.bbtn .n { font-family: var(--font-mono); font-size: 15px; }
.bbtn .band { width: 18px; height: 4px; border-radius: 2px; }
.bandlegend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.bandlegend i { display: inline-block; width: 14px; height: 4px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
.symrow { display: grid; grid-template-columns: 1.6fr 1fr 1fr; gap: 8px; }
.sbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 12px; text-align: left; display: grid; gap: 6px; transition: transform .08s ease, background .15s; min-width: 0; }
.sbtn:active { transform: scale(.97); }
.sbtn:hover { background: var(--surface-2); }
.sbtn .lbl { font-weight: 700; display: flex; align-items: center; gap: 8px; }
.sbtn .cnt { font-size: 12px; color: var(--muted); }
.swatch { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.sev { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.sev button { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 4px; font-size: 13px; font-weight: 700; display: grid; justify-items: center; gap: 4px; }
.sev button:hover { background: var(--surface-2); }
.sev .bars { display: flex; gap: 2px; align-items: flex-end; height: 12px; }
.sev .bars i { width: 4px; border-radius: 1px; background: var(--line); }
.sev .bars i.on { background: var(--bloat); }
.bloatbox { border: 1px solid var(--line); border-radius: 14px; padding: 10px; display: grid; gap: 8px; min-width: 0; }

/* Timeline */
.tl { display: grid; gap: 0; }
.tl-item { display: grid; grid-template-columns: 52px 18px 1fr auto; gap: 8px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); }
.tl-item:last-child { border-bottom: 0; }
.tl-time { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.tl-mark { display: block; align-self: center; width: 12px; height: 12px; border-radius: 50%; justify-self: center; }
.tl-mark.mealm { border-radius: 3px; background: var(--surface-2); border: 2px solid var(--muted); }
.tl-mark.ch { background: var(--accent); transform: rotate(45deg); border-radius: 2px; }
.tl-text { min-width: 0; overflow-wrap: anywhere; }
.tl-text small { color: var(--muted); }
.tl-edit { display: flex; gap: 6px; align-items: center; }
.tl-edit input[type=time] { border: 1px solid var(--line); border-radius: 8px; padding: 4px 6px; background: var(--surface); font-family: var(--font-mono); font-size: 13px; width: 96px; }
.iconbtn { border: 0; background: transparent; color: var(--muted); border-radius: 8px; padding: 4px 6px; }
.iconbtn:hover { color: var(--loose); background: var(--surface-2); }
.empty { color: var(--muted); font-size: 14px; padding: 14px; border: 1px dashed var(--line); border-radius: 12px; text-align: center; }

/* Meals */
.meals { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.meal { border: 1px solid var(--line); border-radius: 14px; padding: 12px; background: var(--surface); text-align: left; display: grid; gap: 8px; align-content: start; min-height: 96px; min-width: 0; }
.meal:hover { border-color: var(--accent); }
.meal.has-ch { border: 2px solid var(--accent); background: var(--accent-soft); padding: 11px; }
.ch-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.ch-badge::before { content: ""; width: 8px; height: 8px; background: var(--accent); transform: rotate(45deg); border-radius: 1px; }
.ch-sheet { border: 2px dashed var(--accent); border-radius: 14px; padding: 12px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.ch-sheet.on { border-style: solid; background: var(--accent-soft); }
.ch-sheet strong { font-family: var(--font-display); font-size: 17px; }
.ch-ctl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ch-ctl input, .ch-ctl select { border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; background: var(--surface); }
.ch-ctl input[type=number] { width: 76px; font-family: var(--font-mono); }
.meal-head { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.meal-head span:last-child { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { font-size: 12.5px; background: var(--surface-2); border-radius: 999px; padding: 3px 9px; display: inline-flex; align-items: center; gap: 5px; max-width: 100%; overflow-wrap: anywhere; }
.chip.ch { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.chip .fl { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.meal .add { color: var(--accent); font-weight: 700; font-size: 13px; }
.warn { font-size: 13px; color: var(--hard); background: color-mix(in srgb, var(--hard) 10%, transparent); padding: 8px 10px; border-radius: 10px; }
textarea.note { width: 100%; min-height: 64px; border: 1px solid var(--line); border-radius: 12px; padding: 10px; background: var(--surface); resize: vertical; }

/* Sheet */
.scrim { position: fixed; inset: 0; background: rgba(8,16,14,.45); z-index: 40; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; background: var(--surface); border-radius: 22px 22px 0 0; max-height: 88%; display: grid; grid-template-rows: auto 1fr auto; box-shadow: 0 -10px 40px rgba(0,0,0,.2); max-width: 680px; margin: 0 auto; }
.sheet-head, .sheet-foot { padding: 14px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 10px; }
.sheet-foot { border-top: 1px solid var(--line); padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
.sheet-body { overflow-y: auto; padding: 4px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; align-content: start; }
.grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); justify-self: center; }
.field { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--surface); width: 100%; min-width: 0; }
.picker-cat { display: grid; gap: 8px; }
.pick { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 11px; font-size: 13.5px; display: inline-flex; align-items: center; gap: 6px; }
.pick.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.pick .fl { width: 7px; height: 7px; border-radius: 50%; }
.legend-fl { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend-fl span { display: inline-flex; align-items: center; gap: 5px; }
.legend-fl i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

/* Tabs */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar .wrap { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding-block: 8px; }
.tab { border: 0; background: transparent; border-radius: 12px; padding: 8px 4px; display: grid; justify-items: center; gap: 2px; font-size: 12px; font-weight: 700; color: var(--muted); }
.tab svg { width: 22px; height: 22px; }
.tab[aria-selected="true"] { color: var(--accent); background: var(--accent-soft); }

/* Insights */
.seg { display: inline-flex; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; border-radius: 9px; padding: 6px 12px; font-weight: 700; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { background: var(--surface); border-radius: var(--r); padding: 14px; box-shadow: var(--shadow); display: grid; gap: 4px; min-width: 0; }
.tile .v { font-family: var(--font-display); font-size: 30px; font-weight: 700; letter-spacing: -.02em; line-height: 1; font-variant-numeric: tabular-nums; }
.tile .l { font-size: 13px; font-weight: 700; display: flex; gap: 6px; align-items: center; }
.tile .s { font-size: 12px; color: var(--muted); }
.chartbox { position: relative; overflow-x: auto; }
.chartbox svg { display: block; }
.chartbox text { font-family: var(--font-body); }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; padding: 8px 10px; border-radius: 10px; line-height: 1.4; z-index: 5; max-width: 230px; box-shadow: var(--shadow); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.tablewrap { overflow-x: auto; }
table.rt { border-collapse: collapse; width: 100%; font-size: 13px; min-width: 460px; }
table.rt th { text-align: left; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding: 6px 8px; border-bottom: 1px solid var(--line); }
table.rt td { padding: 8px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; vertical-align: top; }
table.rt td.num { font-family: var(--font-mono); }
.hi { background: color-mix(in srgb, var(--loose) 14%, transparent); color: var(--loose); font-weight: 700; border-radius: 6px; padding: 1px 6px; }
.block-res { border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 10px; min-width: 0; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 3px 10px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill.good { background: color-mix(in srgb, var(--ideal) 16%, transparent); color: var(--ideal); }
.pill.mid { background: color-mix(in srgb, var(--hard) 16%, transparent); color: var(--hard); }
.pill.bad { background: color-mix(in srgb, var(--loose) 16%, transparent); color: var(--loose); }
.pill.now { background: var(--accent); color: var(--accent-ink); }

/* Plan */
.blocks { display: grid; gap: 10px; }
.blk { border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 8px; min-width: 0; }
.blk.current { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.blk-top { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
.blk-num { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.blk-portions { display: flex; gap: 6px; flex-wrap: wrap; }
.blk-portions span { font-family: var(--font-mono); font-size: 12.5px; background: var(--surface-2); padding: 3px 8px; border-radius: 8px; }
.blk select { border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; background: var(--surface); font-size: 13px; }
.foodcat { display: grid; gap: 6px; padding-block: 8px; border-bottom: 1px solid var(--line); }
.foodcat:last-child { border-bottom: 0; }
.addfood { background: var(--surface-2); border-radius: 14px; padding: 12px; display: grid; gap: 10px; }
.addfood select { border: 1px solid var(--line); border-radius: 12px; padding: 9px 10px; background: var(--surface); }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }
.chip.mine { background: var(--accent-soft); }
.chip-x { border: 0; background: transparent; color: var(--muted); padding: 0 0 0 2px; font-size: 15px; line-height: 1; }
.chip-x:hover { color: var(--loose); }
details summary { cursor: pointer; font-weight: 700; }
ol.rules { margin: 0; padding-left: 20px; display: grid; gap: 6px; color: var(--ink); }
a { color: var(--accent); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 50; background: var(--ink); color: var(--bg); border-radius: 14px; padding: 10px 10px 10px 16px; display: flex; gap: 12px; align-items: center; font-size: 14px; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.toast button { background: transparent; border: 1px solid color-mix(in srgb, var(--bg) 40%, transparent); color: var(--bg); border-radius: 10px; padding: 5px 10px; font-weight: 700; }
.status-note { font-size: 12px; color: var(--muted); text-align: center; }
.confirm { border: 1px solid var(--loose); border-radius: 12px; padding: 12px; display: grid; gap: 8px; }

@media (max-width: 460px) {
  .bristol { gap: 4px; }
  .bbtn { min-height: 76px; border-radius: 12px; }
  .bbtn .n { font-size: 13px; }
  .symrow { grid-template-columns: 1fr 1fr; }
  .bloatbox { grid-column: 1 / -1; }
  .daytitle { font-size: 23px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="hero">
  <div class="wrap">
    <div class="hero-top">
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M7 3c0 4 10 2 10 7s-10 3-10 8c0 2 2 3 4 3"/><circle cx="17" cy="19" r="2"/></svg>
        Gut Log
      </div>
      <div class="daynav">
        <button id="prevDay" aria-label="Previous day">&#8249;</button>
        <button id="todayBtn">Today</button>
        <button id="nextDay" aria-label="Next day">&#8250;</button>
      </div>
    </div>
    <div>
      <div class="daytitle" id="dayTitle">Today</div>
      <div class="daysub" id="daySub"></div>
    </div>
    <div class="phase" id="phasePill"><span class="dot"></span><span id="phaseText">Elimination phase</span></div>
  </div>
</header>

<main class="wrap" id="view"></main>

<nav class="tabbar" aria-label="Sections">
  <div class="wrap" role="tablist">
    <button class="tab" role="tab" data-tab="today" aria-selected="true">

<div id="toastHost"></div>

<script>
(function () {
"use strict";

/* ---------- Static data: food list and reintroduction plan ---------- */
// h = high in histamine or releases histamine (red in the list), g = can cause a marked glucose spike (purple)
const FOODS = [
  { cat: "Fruit", note: "Maximum 2 servings a day, eaten together with other foods", items: [
    ["Raspberries"], ["Strawberries","h"], ["Pomegranate"], ["Kiwi","h"], ["Gold kiwi","h"], ["Lime","h"], ["Lemon","h"],
    ["Mandarin","h"], ["Clementine","h"], ["Passion fruit"], ["Cantaloupe melon","g"], ["Blackberries"], ["Orange","h"],
    ["Pineapple","hg"], ["Banana","hg"], ["Grapefruit","h"], ["Grapes","g"] ] },
  { cat: "Dairy and alternatives", items: [
    ["Almond drink"], ["Coconut drink"], ["Quinoa drink"], ["Rice drink","g"], ["Oat drink","g"], ["Lactose-free milk"],
    ["Parmesan","h"], ["Manchego","h"], ["Brie","h"], ["Goat's cheese log","h"], ["Blue cheese","h"], ["Camembert","h"],
    ["Feta","h"], ["Gruyère","h"], ["Cheddar","h"], ["Lactose-free fresh cheese"], ["Coconut yogurt","h"], ["Lactose-free plain yogurt","h"] ] },
  { cat: "Vegetables and tubers", items: [
    ["Swiss chard"], ["Celery"], ["Celeriac"], ["Aubergine","h"], ["Lettuce"], ["Rocket"], ["Lamb's lettuce"], ["Escarole"], ["Courgette"],
    ["Squash","g"], ["Pumpkin","g"], ["Cardoon"], ["Parsnip","g"], ["Endive"], ["Spinach","h"], ["Green beans"], ["Kale"],
    ["Potato","g"], ["Sweet potato","g"], ["Cassava","g"], ["Hearts of palm"], ["Cucumber"], ["Peppers"], ["Radishes"], ["Tomato","h"], ["Carrot"] ] },
  { cat: "Legumes", items: [ ["Red lentils"], ["Tempeh","h"], ["Firm tofu","h"] ] },
  { cat: "Cereals", items: [
    ["Rice","g"], ["Rice cakes","g"], ["Corn cakes","g"], ["Oats","g"], ["Breakfast cereal","g"], ["Millet","g"], ["Polenta","g"], ["Cornflour","g"],
    ["Quinoa"], ["Sorghum"], ["Teff"], ["Buckwheat"], ["Buckwheat toast"] ] },
  { cat: "Protein", items: [
    ["Chicken"], ["Turkey"], ["Beef"], ["Pork"], ["Lamb"], ["Eggs"], ["Serrano ham","h"], ["Bresaola","h"], ["Fish","h"], ["Seafood","h"], ["Burger or sausage (no gluten or lactose)"] ] },
  { cat: "Fats, condiments and nuts", items: [
    ["Olive oil"], ["Garlic-infused oil"], ["Butter"], ["Olives","h"], ["Pickles","h"], ["Capers","h"], ["Peanuts","h"], ["Almonds","h"], ["Pecans","h"],
    ["Pine nuts","h"], ["Seeds","h"], ["Vinegar","h"], ["Mustard","h"], ["Spices"], ["Fresh herbs"] ] },
  { cat: "Drinks and sweeteners", items: [
    ["Sugar","g"], ["Cocoa","h"], ["Coffee","h"], ["Tea","h"], ["Stevia or sucralose"], ["Maple syrup","g"] ] }
];
const FOOD_FLAGS = {}; const FOOD_CAT = {};
FOODS.forEach(c => c.items.forEach(([n, f]) => { FOOD_FLAGS[n] = f || ""; FOOD_CAT[n] = c.cat; }));

function addedFoods() { return state.settings.addedFoods || []; }
function findAdded(n) { return addedFoods().find(a => a.name.toLowerCase() === n.toLowerCase()); }
function flagsOf(n) { const a = findAdded(n); return a ? (a.h ? "h" : "") + (a.g ? "g" : "") : (FOOD_FLAGS[n] || ""); }
function catOf(n) { const a = findAdded(n); return a ? a.cat : FOOD_CAT[n]; }
function foodList() { return FOODS.map(c => ({ cat: c.cat, note: c.note, items: [...c.items.map(i => i[0]), ...addedFoods().filter(a => a.cat === c.cat).map(a => a.name)] })); }
function onList(n) { return Object.keys(FOOD_FLAGS).some(k => k.toLowerCase() === n.toLowerCase()) || !!findAdded(n); }

const BLOCKS = [
  { n: 1, group: "Sorbitol", food: "Avocado", g: [30, 60, 90] },
  { n: 2, group: "Mannitol", food: "Button mushrooms, cooked", g: [40, 75, 150] },
  { n: 3, group: "Fructans (wheat)", food: "Long-fermented wheat sourdough", g: [30, 60, 100] },
  { n: 4, group: "Fructans (garlic)", food: "Garlic, cooked into a dish", g: [1, 2, 4] },
  { n: 5, group: "Fructans (onion)", food: "White onion, cooked", g: [10, 25, 50] },
  { n: 6, group: "GOS", food: "Canned chickpeas, rinsed", g: [45, 90, 135] },
  { n: 7, group: "Fructose", food: "Ripe mango, fresh", g: [40, 80, 140] },
  { n: 8, group: "Lactose", food: "Plain skyr (regular, not lactose-free)", g: [80, 160, 250] }
];
const BONUS = [
  { food: "Dairy ice cream", grams: 60, onlyIf: "Lactose tolerated at 160 g or more" },
  { food: "Dairy ice cream", grams: 120, onlyIf: "The first ice cream day went well" },
  { food: "Pizza margherita", grams: 120, onlyIf: "Wheat fructans tolerated at 60 g or more" },
  { rest: true }
];
const PLAN_DOC = "https://claude.ai/artifact/63Ft7WNvocB2UybGHqHXTL";

const BRISTOL = [
  { n: 1, label: "Hard lumps", band: "hard" },
  { n: 2, label: "Lumpy sausage", band: "hard" },
  { n: 3, label: "Cracked sausage", band: "ideal" },
  { n: 4, label: "Smooth sausage", band: "ideal" },
  { n: 5, label: "Soft blobs", band: "ideal" },
  { n: 6, label: "Mushy", band: "loose" },
  { n: 7, label: "Watery", band: "loose" }
];
const BAND_NAME = { hard: "Constipated (1-2)", ideal: "Ideal (3-5)", loose: "Loose (6-7)" };
const MEALS = [
  { k: "breakfast", label: "Breakfast", def: "08:30" },
  { k: "lunch", label: "Lunch", def: "14:00" },
  { k: "dinner", label: "Dinner", def: "21:00" },
  { k: "snack", label: "Snacks", def: "17:30" }
];
const SYM = {
  bloat: { label: "Bloating", color: "var(--bloat)" },
  burp: { label: "Burps / reflux", color: "var(--burp)" },
  gas: { label: "Gas", color: "var(--gas)" },
  stool: { label: "Bowel movement", color: "var(--stool-ink)" }
};
const SEV = ["", "Mild", "Moderate", "Strong"];

function bristolSvg(n) {
  const s = 'fill="currentColor"';
  switch (n) {
    case 1: return `<svg viewBox="0 0 48 30" aria-hidden="true"><circle cx="9" cy="17" r="5" ${s}/><circle cx="21" cy="12" r="4.5" ${s}/><circle cx="31" cy="19" r="5" ${s}/><circle cx="41" cy="13" r="4" ${s}/></svg>`;
    case 2: return `<svg viewBox="0 0 48 30" aria-hidden="true"><g ${s}><circle cx="10" cy="15" r="6"/><circle cx="19" cy="13" r="6.5"/><circle cx="29" cy="16" r="6.5"/><circle cx="38" cy="14" r="6"/></g></svg>`;
    case 3: return `<svg viewBox="0 0 48 30" aria-hidden="true"><rect x="4" y="9" width="40" height="13" rx="6.5" ${s}/><path d="M14 9.5v4M22 21.5v-4M30 9.5v5M37 21.5v-3" stroke="var(--surface)" stroke-width="1.6" stroke-linecap="round"/></svg>`;
    case 4: return `<svg viewBox="0 0 48 30" aria-hidden="true"><path d="M6 18c4-8 12-8 18-4s14 4 18-4" stroke="currentColor" stroke-width="8" stroke-linecap="round" fill="none"/></svg>`;
    case 5: return `<svg viewBox="0 0 48 30" aria-hidden="true"><g ${s}><ellipse cx="11" cy="16" rx="7" ry="5.5"/><ellipse cx="25" cy="13" rx="6.5" ry="5"/><ellipse cx="38" cy="17" rx="6.5" ry="5"/></g></svg>`;
    case 6: return `<svg viewBox="0 0 48 30" aria-hidden="true"><path ${s} d="M6 19c-2-5 3-8 7-7 1-4 7-5 9-2 3-3 9-2 10 2 4-1 9 2 8 6 3 2 1 6-3 6H10c-4 0-6-2-4-5z"/></svg>`;
    default: return `<svg viewBox="0 0 48 30" aria-hidden="true"><path ${s} opacity=".85" d="M4 20c4-3 8 1 12-1s7-4 11-2 8 3 11 1 6-1 6 2-3 4-8 4H9c-4 0-7-2-5-4z"/><circle cx="14" cy="12" r="1.8" ${s} opacity=".6"/><circle cx="31" cy="10" r="1.4" ${s} opacity=".6"/></svg>`;
  }
}

/* ---------- Date helpers (local dates as YYYY-MM-DD) ---------- */
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d, 12); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
const todayIso = () => iso(new Date());
const nowHM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const hmToMin = t => { const [h, m] = (t || "0:0").split(":").map(Number); return h * 60 + m; };
const fmtLong = s => parse(s).toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
const fmtShort = s => parse(s).toLocaleDateString("en-GB", { day: "numeric", month: "short" });
const fmtDow = s => parse(s).toLocaleDateString("en-GB", { weekday: "short" });
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const r1 = x => Math.round(x * 10) / 10;

/* ---------- Plan schedule ---------- */
function buildSchedule(settings) {
  const start = settings.planStart || "2026-11-01";
  const extra = settings.extraRest || {};
  const map = {}; const blocks = [];
  let d = start;
  BLOCKS.forEach(b => {
    const rest = 2 + (extra[b.n] || 0);
    const info = { ...b, start: d, end: addDays(d, 2 + rest), restDays: rest };
    for (let i = 0; i < 3; i++) map[addDays(d, i)] = { kind: "challenge", block: b, day: i + 1, food: b.food, grams: b.g[i], label: b.group };
    for (let i = 0; i < rest; i++) map[addDays(d, 3 + i)] = { kind: "rest", block: b, day: i + 1, label: b.group };
    blocks.push(info);
    d = addDays(d, 3 + rest);
  });
  const bonusStart = d;
  BONUS.forEach((x, i) => {
    const day = addDays(d, i);
    map[day] = x.rest ? { kind: "final-rest", label: "Rest before the appointment" } : { kind: "bonus", food: x.food, grams: x.grams, onlyIf: x.onlyIf, label: "Bonus test", bonusIndex: i };
  });
  return { start, map, blocks, bonusStart, end: addDays(d, BONUS.length - 1) };
}

/* ---------- State and storage ---------- */
const state = {
  tab: "today",
  date: todayIso(),
  days: {},
  settings: { planStart: "2026-11-01", extraRest: {}, outcomes: {}, customFoods: [], addedFoods: [] },
  lastCat: "Cereals",
  range: 14,
  backend: "starting",
  editing: null,
  sheet: null,
  confirmImport: null
};
try { const t = localStorage.getItem("gutlog-tab"); if (t) state.tab = t; } catch (e) {}

const LOCAL_KEY = "gutlog-data-v1";
let db = null;

function emptyDay(date) { return { date, events: [], meals: {}, challenge: null, note: "" }; }
function getDay(date) { return state.days[date] || emptyDay(date); }

function localSave() {
  try { localStorage.setItem(LOCAL_KEY, JSON.stringify({ days: state.days, settings: state.settings })); } catch (e) {}
}
function localLoad() {
  try { const raw = localStorage.getItem(LOCAL_KEY); if (raw) { const o = JSON.parse(raw); state.days = o.days || {}; Object.assign(state.settings, o.settings || {}); } } catch (e) {}
}

async function saveDay(day) {
  state.days[day.date] = day;
  render();
  if (db) {
    try { await db.doc("days/" + day.date).set(day); }
    catch (e) { toast("Could not save. Check your connection and try again."); }
  } else localSave();
}
async function saveSettings() {
  render();
  if (db) {
    try { await db.doc("settings/main").set(state.settings); }
    catch (e) { toast("Could not save settings."); }
  } else localSave();
}

async function initStorage() {
  localLoad();
  render();
  let ns = null;
  try { ns = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch (e) { ns = null; }
  if (!ns) { state.backend = "local"; render(); return; }
  db = ns; state.backend = "db";
  db.collection("days").onSnapshot(snap => {
    const days = {};
    snap.docs.forEach(d => { if (d.exists) days[d.id] = d.data(); });
    state.days = days; render();
  }, () => { state.backend = "error"; render(); });
  db.doc("settings/main").onSnapshot(snap => {
    if (snap.exists) state.settings = Object.assign({ planStart: "2026-11-01", extraRest: {}, outcomes: {}, customFoods: [], addedFoods: [] }, snap.data());
    render();
  }, () => {});
  render();
}

/* ---------- Day metrics ---------- */
function metrics(day) {
  const ev = (day && day.events) || [];
  const bloats = ev.filter(e => e.type === "bloat");
  const stools = ev.filter(e => e.type === "stool");
  const mealsLogged = day && Object.values(day.meals || {}).some(m => (m.foods || []).length);
  return {
    bloatN: bloats.length,
    bloatScore: bloats.reduce((a, e) => a + (e.v || 1), 0),
    bloatMax: bloats.reduce((a, e) => Math.max(a, e.v || 1), 0),
    burps: ev.filter(e => e.type === "burp").length,
    gas: ev.filter(e => e.type === "gas").length,
    stools: stools.map(e => e.v),
    logged: ev.length > 0 || !!mealsLogged || !!(day && day.challenge)
  };
}

/* ---------- Actions ---------- */
function mealForTime(t) { const m = hmToMin(t); return m < 660 ? "breakfast" : m < 990 ? "lunch" : m < 1170 ? "snack" : "dinner"; }
function mealLabel(k) { return (MEALS.find(x => x.k === k) || MEALS[1]).label; }
function chMeal(c) { return (c && c.meal) || "lunch"; }
function logEvent(type, v) {
  const day = structuredClone(getDay(state.date));
  const ev = { id: uid(), t: nowHM(), type };
  if (v != null) ev.v = v;
  day.events.push(ev);
  day.events.sort((a, b) => hmToMin(a.t) - hmToMin(b.t));
  saveDay(day);
  const name = type === "stool" ? `Bristol type ${v}` : type === "bloat" ? `${SEV[v]} bloating` : SYM[type].label;
  toast(`${name} logged at ${ev.t}`, () => {
    const d2 = structuredClone(getDay(state.date));
    d2.events = d2.events.filter(e => e.id !== ev.id);
    saveDay(d2);
  });
}
function deleteEvent(id) {
  const day = structuredClone(getDay(state.date));
  day.events = day.events.filter(e => e.id !== id);
  state.editing = null;
  saveDay(day);
}
function setEventTime(id, t) {
  const day = structuredClone(getDay(state.date));
  const e = day.events.find(x => x.id === id); if (!e || !t) return;
  e.t = t; day.events.sort((a, b) => hmToMin(a.t) - hmToMin(b.t));
  saveDay(day);
}
function logChallenge(entry) {
  const day = structuredClone(getDay(state.date));
  const t = nowHM();
  day.challenge = { ate: true, t, food: entry.food, grams: entry.grams, planned: entry.grams, block: entry.block ? entry.block.n : null, day: entry.day || null, meal: mealForTime(t) };
  saveDay(day);
  toast(`${entry.food}, ${entry.grams} g logged with ${mealLabel(day.challenge.meal).toLowerCase()}`);
}

/* ---------- Toast ---------- */
let toastTimer = null;
function toast(msg, undo) {
  const host = document.getElementById("toastHost");
  host.innerHTML = `<div class="toast" role="status"><span>${esc(msg)}</span>${undo ? '<button id="undoBtn">Undo</button>' : ""}</div>`;
  if (undo) document.getElementById("undoBtn").onclick = () => { host.innerHTML = ""; undo(); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { host.innerHTML = ""; }, 4500);
}

/* ---------- Header ---------- */
function renderHeader(sched) {
  const t = todayIso();
  const diff = diffDays(t, state.date);
  document.getElementById("dayTitle").textContent = diff === 0 ? "Today" : diff === -1 ? "Yesterday" : fmtLong(state.date);
  document.getElementById("daySub").textContent = diff === 0 || diff === -1 ? fmtLong(state.date) : (diff < 0 ? `${-diff} days ago` : `In ${diff} days`);
  document.getElementById("nextDay").disabled = state.date >= t;
  document.getElementById("todayBtn").hidden = state.date === t;
  const e = sched.map[state.date];
  const pill = document.getElementById("phasePill");
  pill.className = "phase";
  let txt;
  if (!e) {
    if (state.date < sched.start) { const n = diffDays(state.date, sched.start); txt = `Elimination phase · reintroduction in ${n} day${n === 1 ? "" : "s"}`; }
    else txt = "Reintroduction plan finished";
  } else if (e.kind === "challenge") { pill.classList.add("ph-ch"); txt = `Block ${e.block.n} · ${e.block.group} · challenge day ${e.day}`; }
  else if (e.kind === "rest") { pill.classList.add("ph-rest"); txt = `Block ${e.block.n} · ${e.block.group} · rest day ${e.day}`; }
  else if (e.kind === "bonus") { pill.classList.add("ph-ch"); txt = `Bonus test · ${e.food}`; }
  else { pill.classList.add("ph-rest"); txt = "Rest day before the appointment"; }
  document.getElementById("phaseText").textContent = txt;
}

/* ---------- Today view ---------- */
function challengeCard(sched) {
  const e = sched.map[state.date];
  const day = getDay(state.date);
  if (!e) {
    if (state.date < sched.start) {
      return `<div class="challenge"><div class="eyebrow">Elimination phase</div>
        <div class="big">Strict low FODMAP</div>
        <p class="hint">Your first challenge, ${esc(BLOCKS[0].food.toLowerCase())} (${esc(BLOCKS[0].group.toLowerCase())}), starts on ${fmtLong(sched.start)}. Logging now builds the baseline your reintroduction results are compared to.</p></div>`;
    }
    return "";
  }
  if (e.kind === "rest" || e.kind === "final-rest") {
    return `<div class="challenge"><div class="eyebrow">${e.kind === "rest" ? `Block ${e.block.n} · rest day ${e.day} of ${((state.settings.extraRest || {})[e.block.n] || 0) + 2}` : "Before the appointment"}</div>
      <div class="big">Rest day, strict low FODMAP</div>
      <p class="hint">Keep going until you are back to your usual. If it takes more than 2 days, add a rest day in the Plan tab and the calendar shifts.</p></div>`;
  }
  const dots = e.kind === "challenge" ? `<div class="daydots">${[1, 2, 3].map(i => `<span class="${i <= e.day ? "on" : ""}"></span>`).join("")}</div>` : "";
  const eyebrow = e.kind === "challenge" ? `Block ${e.block.n} · ${esc(e.block.group)} · day ${e.day} of 3` : `Bonus test · only if: ${esc(e.onlyIf)}`;
  const action = day.challenge && day.challenge.ate
    ? `<div class="ch-ctl"><span class="done-pill">&#10003; Eaten</span>
        <input type="number" id="chGrams" min="0" step="1" inputmode="numeric" value="${esc(day.challenge.grams)}" aria-label="Grams eaten"><span class="hint">g at</span>
        <input type="time" id="chTime" value="${esc(day.challenge.t)}" aria-label="Time eaten"><span class="hint">with</span>
        <select id="chMeal" aria-label="Meal">${MEALS.map(m => `<option value="${m.k}" ${chMeal(day.challenge) === m.k ? "selected" : ""}>${m.label.toLowerCase()}</option>`).join("")}</select>
        <button class="btn small ghost danger" id="chUndo">Remove</button></div>
        ${Number(day.challenge.grams) !== Number(e.grams) ? `<p class="hint">Planned portion was ${e.grams} g.</p>` : ""}`
    : `<div class="row"><button class="btn primary" id="chLog">I ate it now</button><span class="hint">Or add it from the meal you ate it with. Ideally lunch, same meal each day.</span></div>`;
  return `<div class="challenge"><div class="eyebrow">${eyebrow}</div>
    <div class="row" style="justify-content:space-between;align-items:baseline"><div class="big">${esc(e.food)}</div><div class="grams">${e.grams} g</div></div>
    ${dots}${action}</div>`;
}

function quickLog(day) {
  const m = metrics(day);
  const stoolCount = m.stools.length;
  return `<section class="card" aria-labelledby="qlh">
    <div class="sec-head"><h2 id="qlh">Log a symptom</h2><span class="hint">One tap logs it at the current time</span></div>
    <div class="qgroup">
      <div class="sec-head"><h3>Bowel movement</h3><span class="hint">${stoolCount ? `${stoolCount} today` : "Bristol scale"}</span></div>
      <div class="bristol">
        ${BRISTOL.map(b => `<button class="bbtn" data-stool="${b.n}" aria-label="Bristol type ${b.n}, ${b.label}" title="${b.label}">
          ${bristolSvg(b.n)}<span class="n">${b.n}</span><span class="band" style="background:var(--${b.band})"></span></button>`).join("")}
      </div>
      <div class="bandlegend"><span><i style="background:var(--hard)"></i>1-2 constipated</span><span><i style="background:var(--ideal)"></i>3-5 ideal</span><span><i style="background:var(--loose)"></i>6-7 loose</span></div>
    </div>
    <div class="symrow">
      <div class="bloatbox">
        <div class="sbtn" style="border:0;padding:0;background:transparent"><span class="lbl"><span class="swatch" style="background:var(--bloat)"></span>Bloating</span><span class="cnt">${m.bloatN ? `${m.bloatN} today` : "How strong?"}</span></div>
        <div class="sev">${[1, 2, 3].map(v => `<button data-bloat="${v}" aria-label="${SEV[v]} bloating"><span class="bars">${[1, 2, 3].map(i => `<i class="${i <= v ? "on" : ""}" style="height:${4 + i * 3}px"></i>`).join("")}</span>${SEV[v]}</button>`).join("")}</div>
      </div>
      <button class="sbtn" data-sym="burp"><span class="lbl"><span class="swatch" style="background:var(--burp)"></span>Burps</span><span class="cnt">Gas coming up${m.burps ? ` · ${m.burps} today` : ""}</span></button>
      <button class="sbtn" data-sym="gas"><span class="lbl"><span class="swatch" style="background:var(--gas)"></span>Gas</span><span class="cnt">Downward${m.gas ? ` · ${m.gas} today` : ""}</span></button>
    </div>
  </section>`;
}

function timeline(day) {
  const items = [];
  (day.events || []).forEach(e => items.push({ t: e.t, kind: "ev", e }));
  MEALS.forEach(mm => { const m = (day.meals || {})[mm.k]; if (m && (m.foods || []).length) items.push({ t: m.time || mm.def, kind: "meal", mm, m }); });
  if (day.challenge && day.challenge.ate) items.push({ t: day.challenge.t, kind: "ch", c: day.challenge });
  items.sort((a, b) => hmToMin(a.t) - hmToMin(b.t));
  if (!items.length) return `<div class="empty">Nothing logged ${state.date === todayIso() ? "today" : "on this day"} yet. Tap a symptom above or add a meal below.</div>`;
  return `<div class="tl">${items.map(it => {
    if (it.kind === "meal") return `<div class="tl-item"><span class="tl-time">${esc(it.t)}</span><span class="tl-mark mealm"></span><span class="tl-text"><strong>${it.mm.label}</strong> <small>${esc(it.m.foods.join(", "))}</small></span><span></span></div>`;
    if (it.kind === "ch") return `<div class="tl-item"><span class="tl-time">${esc(it.t)}</span><span class="tl-mark ch"></span><span class="tl-text"><strong>Reintroduction</strong> <small>${esc(it.c.food)}, ${it.c.grams} g, with ${mealLabel(chMeal(it.c)).toLowerCase()}</small></span><span></span></div>`;
    const e = it.e;
    let color = SYM[e.type].color, text;
    if (e.type === "stool") { const b = BRISTOL[e.v - 1]; color = `var(--${b.band})`; text = `<strong>Bristol ${e.v}</strong> <small>${b.label}</small>`; }
    else if (e.type === "bloat") text = `<strong>Bloating</strong> <small>${SEV[e.v || 1].toLowerCase()}</small>`;
    else text = `<strong>${SYM[e.type].label}</strong>`;
    const editing = state.editing === e.id;
    return `<div class="tl-item"><span class="tl-time">${esc(e.t)}</span><span class="tl-mark" style="background:${color}"></span><span class="tl-text">${text}</span>
      ${editing ? `<span class="tl-edit"><input type="time" id="t-${e.id}" value="${esc(e.t)}" data-evtime="${e.id}" aria-label="Change time"><button class="iconbtn" data-del="${e.id}" aria-label="Delete entry">&#128465;</button><button class="iconbtn" data-done aria-label="Done">&#10003;</button></span>`
        : `<button class="iconbtn" data-edit="${e.id}" aria-label="Edit entry">Edit</button>`}</div>`;
  }).join("")}</div>`;
}

function mealsSection(day, sched) {
  const e = sched.map[state.date];
  const fruit = Object.values(day.meals || {}).flatMap(m => m.foods || []).filter(f => catOf(f) === "Fruit").length;
  return `<section class="card" aria-labelledby="mh">
    <div class="sec-head"><h2 id="mh">Meals</h2><span class="hint">Tap a meal to add foods</span></div>
    <div class="meals">${MEALS.map(mm => {
      const m = (day.meals || {})[mm.k] || {};
      const foods = m.foods || [];
      const chHere = day.challenge && day.challenge.ate && chMeal(day.challenge) === mm.k;
      return `<button class="meal ${chHere ? "has-ch" : ""}" data-meal="${mm.k}">
        ${chHere ? '<span class="ch-badge">Reintroduction</span>' : ""}
        <div class="meal-head"><h3>${mm.label}</h3><span>${foods.length ? esc(m.time || mm.def) : chHere ? esc(day.challenge.t) : ""}</span></div>
        ${foods.length || chHere ? `<div class="chips">${chHere ? `<span class="chip ch">${esc(day.challenge.food)} ${day.challenge.grams} g</span>` : ""}${foods.map(f => chipHtml(f)).join("")}</div>` : `<span class="add">+ Add foods</span>`}
        ${m.note ? `<span class="hint">${esc(m.note)}</span>` : ""}
      </button>`;
    }).join("")}</div>
    ${fruit > 2 ? `<div class="warn">${fruit} fruit servings today. Your list advises a maximum of 2 a day, eaten with other foods.</div>` : ""}
    ${e && e.kind === "challenge" ? `<p class="hint">Keep the rest of your plate low FODMAP and similar from day to day so the challenge result is clean.</p>` : ""}
  </section>`;
}

function flagDots(f) {
  const fl = flagsOf(f);
  return (fl.includes("h") ? '<span class="fl" style="background:var(--hist)" title="Histamine"></span>' : "") + (fl.includes("g") ? '<span class="fl" style="background:var(--gluc)" title="Glucose spike"></span>' : "");
}
function chipHtml(f) { return `<span class="chip">${flagDots(f)}${esc(f)}</span>`; }

function renderToday(sched) {
  const day = getDay(state.date);

function storageNote() {
  const s = state.backend;
  const txt = s === "db" ? "Saved to your account. Syncs across your devices." : s === "local" ? "Saved in this browser only." : s === "error" ? "Sync stopped. Reload the page to reconnect." : "Connecting…";
  return `<p class="status-note">${txt}</p>`;
}

/* ---------- Meal sheet ---------- */
function openMeal(k) {
  const day = getDay(state.date);
  const m = (day.meals || {})[k] || {};
  const mm = MEALS.find(x => x.k === k);
  const c = day.challenge;
  state.sheet = { k, foods: [...(m.foods || [])], time: m.time || (c && c.ate && chMeal(c) === k ? c.t : (state.date === todayIso() ? nowHM() : mm.def)), note: m.note || "", q: "",
    ch: !!(c && c.ate && chMeal(c) === k), chGrams: c && c.ate ? c.grams : null };
  renderSheet();
}
function recentFoods() {
  const count = {};
  Object.values(state.days).forEach(d => Object.values(d.meals || {}).forEach(m => (m.foods || []).forEach(f => { count[f] = (count[f] || 0) + 1; })));
  return Object.entries(count).sort((a, b) => b[1] - a[1]).slice(0, 14).map(x => x[0]);
}
function renderSheet() {
  const host = document.getElementById("overlay");

  const recent = recentFoods();
  const custom = state.settings.customFoods || [];
  const cats = foodList().map(c => ({ cat: c.cat, note: c.note, items: c.items.filter(n => !q || n.toLowerCase().includes(q)) })).filter(c => c.items.length);
  const customMatch = custom.filter(n => !q || n.toLowerCase().includes(q));
  const prev = addDays(state.date, -1);
  const prevMeal = ((state.days[prev] || {}).meals || {})[s.k];
  const plan = buildSchedule(state.settings).map[state.date];
  const isCh = plan && (plan.kind === "challenge" || plan.kind === "bonus");
  const dc = getDay(state.date).challenge;
  const elsewhere = dc && dc.ate && chMeal(dc) !== s.k;
  const chBanner = isCh && !q ? `<div class="ch-sheet ${s.ch ? "on" : ""}">
      <div><span class="ch-badge">Reintroduction${plan.kind === "challenge" ? ` · day ${plan.day}` : ""}</span><br><strong>${esc(plan.food)}</strong> <span class="mono">${plan.grams} g planned</span>
      ${elsewhere && !s.ch ? `<br><span class="hint">Logged with ${mealLabel(chMeal(dc)).toLowerCase()}. Adding it here moves it.</span>` : ""}</div>
      <div class="ch-ctl">${s.ch ? `<input type="number" id="sheetChGrams" min="0" step="1" inputmode="numeric" value="${esc(s.chGrams ?? plan.grams)}" aria-label="Grams eaten"><span class="hint">g</span>` : ""}
        <button class="btn small ${s.ch ? "" : "primary"}" id="toggleCh">${s.ch ? "Remove" : "Add to this meal"}</button></div>
    </div>` : "";
  const body = `
    ${chBanner}
    ${s.foods.length ? `<div class="picker-cat"><span class="eyebrow">On your plate</span><div class="chips">${s.foods.map(f => `<button class="pick on" data-pick="${esc(f)}">${flagDots(f)}${esc(f)} &#215;</button>`).join("")}</div></div>` : ""}
    ${!q && prevMeal && (prevMeal.foods || []).length ? `<button class="btn small" id="copyPrev">Same as yesterday's ${mm.label.toLowerCase()}</button>` : ""}
    ${!q && recent.length ? `<div class="picker-cat"><span class="eyebrow">Your usual</span><div class="chips">${recent.map(pick).join("")}</div></div>` : ""}
    ${customMatch.length ? `<div class="picker-cat"><span class="eyebrow">Added by you</span><div class="chips">${customMatch.map(pick).join("")}</div></div>` : ""}
    ${cats.map(c => `<div class="picker-cat"><span class="eyebrow">${esc(c.cat)}</span>${c.note && !q ? `<span class="hint">${esc(c.note)}</span>` : ""}<div class="chips">${c.items.map(pick).join("")}</div></div>`).join("")}
    ${q && !cats.length && !customMatch.length ? `<div class="empty">"${esc(s.q)}" is not on your low FODMAP list. Add it below if you ate it anyway.</div>` : ""}
    <div class="legend-fl"><span><i style="background:var(--hist)"></i>Histamine, in moderation</span><span><i style="background:var(--gluc)"></i>Glucose spike, in moderation</span></div>`;
  host.innerHTML = `<div class="scrim" id="scrim"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-head"><span class="grab"></span>
        <div class="row" style="justify-content:space-between"><h2 id="sheetTitle">${mm.label}</h2>
          <label class="row hint" for="mealTime">Time <input type="time" id="mealTime" class="field mono" style="width:110px;padding:6px 8px" value="${esc(s.time)}"></label></div>
        <input class="field" id="foodSearch" type="search" placeholder="Search foods" value="${esc(s.q)}" autocomplete="off">
      </div>

      <div class="sheet-foot">
        <div class="row" style="flex-wrap:nowrap"><input class="field" id="customFood" placeholder="Something else? Type it and press Add" autocomplete="off"><button class="btn" id="addCustom">Add</button></div>
        <input class="field" id="mealNote" placeholder="Note (portion, restaurant, how it was cooked)" value="${esc(s.note)}">
        <div class="row" style="justify-content:space-between">${s.foods.length || ((getDay(state.date).meals || {})[s.k]) ? '<button class="btn ghost danger" id="clearMeal">Clear meal</button>' : "<span></span>"}<button class="btn primary" id="saveMeal">Save ${mm.label.toLowerCase()}</button></div>
      </div>
    </div>`;
}
function closeSheet() { state.sheet = null; renderSheet(); }
function saveMeal(clear) {
  const s = state.sheet;
  const day = structuredClone(getDay(state.date));
  day.meals = day.meals || {};
  if (clear || !s.foods.length) delete day.meals[s.k];
  else day.meals[s.k] = { foods: s.foods, time: s.time, note: s.note };
  const plan = buildSchedule(state.settings).map[state.date];
  const wasHere = day.challenge && day.challenge.ate && chMeal(day.challenge) === s.k;
  if (s.ch && !clear && plan && plan.food) {
    const g = Number(s.chGrams ?? plan.grams);
    day.challenge = { ...(day.challenge || {}), ate: true, t: s.time, food: plan.food, grams: isNaN(g) ? plan.grams : g, planned: plan.grams,
      block: plan.block ? plan.block.n : null, day: plan.day || null, meal: s.k };
  } else if (wasHere) day.challenge = null;
  closeSheet();
  saveDay(day);
}

/* ---------- Insights ---------- */
function rangeDates(n) { const t = todayIso(); return Array.from({ length: n }, (_, i) => addDays(t, i - n + 1)); }

function baseline(sched, beforeDate) {
  // average of the 7 most recent logged non-challenge days before a date
  const vals = [];
  for (let i = 1; i <= 30 && vals.length < 7; i++) {
    const d = addDays(beforeDate, -i);
    const e = sched.map[d];
    if (e && (e.kind === "challenge" || e.kind === "bonus")) continue;
    const m = metrics(state.days[d]);
    if (m.logged) vals.push(m);
  }
  if (!vals.length) return null;
  const avg = k => vals.reduce((a, m) => a + m[k], 0) / vals.length;
  return { n: vals.length, bloatScore: avg("bloatScore"), burps: avg("burps"), gas: avg("gas"), stoolsPerDay: vals.reduce((a, m) => a + m.stools.length, 0) / vals.length };
}

function renderInsights(sched) {
  const dates = rangeDates(state.range);
  const ms = dates.map(d => metrics(state.days[d]));
  const logged = ms.filter(m => m.logged);
  const n = logged.length || 1;
  const allStools = logged.flatMap(m => m.stools);
  const ideal = allStools.filter(v => v >= 3 && v <= 5).length;
  const tile = (label, color, v, s) => `<div class="tile"><span class="l">${color ? `<span class="swatch" style="background:${color}"></span>` : ""}${label}</span><span class="v">${v}</span><span class="s">${s}</span></div>`;
  const seg = `<div class="seg" role="group" aria-label="Time range">${[7, 14, 30].map(r => `<button data-range="${r}" aria-pressed="${state.range === r}">${r} days</button>`).join("")}</div>`;

  if (!logged.length) {
    return `<div class="sec-head"><h2>Insights</h2>${seg}</div>
      <div class="empty" style="background:var(--surface)">No entries in the last ${state.range} days yet. Charts and stats appear here once you start logging symptoms and meals in the Log tab.</div>
      ${reintroSection(sched)}`;
  }
  return `<div class="sec-head"><h2>Insights</h2>${seg}</div>
    <p class="hint">Averages over the ${logged.length} day${logged.length === 1 ? "" : "s"} you logged in the last ${state.range}.</p>
    <div class="tiles">
      ${tile("Bowel movements", "", r1(allStools.length / n), allStools.length ? `per day · ${Math.round(ideal / allStools.length * 100)}% ideal (type 3-5)` : "per day")}
      ${tile("Bloating", "var(--bloat)", r1(logged.reduce((a, m) => a + m.bloatN, 0) / n), "episodes per day")}
      ${tile("Burps", "var(--burp)", r1(logged.reduce((a, m) => a + m.burps, 0) / n), "per day")}
      ${tile("Gas", "var(--gas)", r1(logged.reduce((a, m) => a + m.gas, 0) / n), "per day")}
    </div>
    <section class="card"><div class="sec-head"><h2>Day by day</h2></div>
      <div class="legend"><span><span class="swatch" style="background:var(--accent);border-radius:2px;transform:rotate(45deg)"></span>Challenge day</span><span><span class="swatch" style="background:var(--ideal)"></span>Stool 3-5</span><span><span class="swatch" style="background:var(--hard)"></span>1-2</span><span><span class="swatch" style="background:var(--loose)"></span>6-7</span></div>
      <div class="chartbox" id="dailyChart" data-dates="${dates.join(",")}"></div>
    </section>
    ${reintroSection(sched)}
    <section class="card"><div class="sec-head"><h2>Time of day</h2><span class="hint">When symptoms happen, all logged days in range</span></div>
      <div class="legend"><span><span class="swatch" style="background:var(--bloat)"></span>Bloating</span><span><span class="swatch" style="background:var(--burp)"></span>Burps</span><span><span class="swatch" style="background:var(--gas)"></span>Gas</span></div>
      <div class="chartbox" id="hourChart" data-dates="${dates.join(",")}"></div>
    </section>
    <section class="card"><div class="sec-head"><h2>Meals and symptoms</h2><span class="hint">Last 7 days on a 24-hour line</span></div>
      <div class="legend"><span><span class="swatch" style="background:var(--muted);border-radius:2px"></span>Meal</span><span><span class="swatch" style="background:var(--accent);border-radius:2px;transform:rotate(45deg)"></span>Challenge food</span><span><span class="swatch" style="background:var(--bloat)"></span>Bloating</span><span><span class="swatch" style="background:var(--burp)"></span>Burps</span><span><span class="swatch" style="background:var(--gas)"></span>Gas</span></div>
      <div class="chartbox" id="dayLines"></div>
    </section>`;
}

function reintroSection(sched) {
  const t = todayIso();
  const started = sched.blocks.filter(b => b.start <= t);
  if (!started.length) {
    return `<section class="card"><div class="sec-head"><h2>Reintroduction results</h2></div>
      <p class="hint">Starts ${fmtLong(sched.start)}. For each block you will see the challenge food and portion next to your bloating, burps, gas and stools, compared with your usual on low FODMAP days.</p></section>`;
  }
  const out = started.map(b => {
    const base = baseline(sched, b.start);
    const days = [0, 1, 2, 3, 4].map(i => addDays(b.start, i));
    const flag = (v, bv) => bv != null && v >= Math.max(bv * 1.5, bv + 1) && v > 0;
    const rows = days.map((d, i) => {
      if (d > t) return "";
      const day = state.days[d]; const m = metrics(day);
      const isCh = i < 3;
      let lag = "";
      if (isCh && day && day.challenge && day.challenge.ate) {
        const c = hmToMin(day.challenge.t);
        const first = (day.events || []).filter(e => e.type !== "stool" && hmToMin(e.t) >= c).sort((a, b) => hmToMin(a.t) - hmToMin(b.t))[0];
        lag = first ? `${r1((hmToMin(first.t) - c) / 60)} h` : "none";
      }
      const st = m.stools.length ? m.stools.join(", ") : "-";
      const cell = (v, bv) => `<td class="num">${flag(v, bv) ? `<span class="hi">${v}</span>` : v}</td>`;
      const c = day && day.challenge && day.challenge.ate ? day.challenge : null;
      const cm = c && ((day.meals || {})[chMeal(c)] || {}).foods;
      const ctx = c ? `<br><small class="hint">${Number(c.grams) !== b.g[i] ? `<strong>Ate ${c.grams} g</strong> · ` : ""}${mealLabel(chMeal(c))} ${esc(c.t)}${cm && cm.length ? ` with ${esc(cm.join(", "))}` : ""}</small>` : "";
      return `<tr><td>${isCh ? `Day ${i + 1} · <span class="mono">${b.g[i]} g</span>${c ? "" : ' <span class="hint">(not logged)</span>'}` : "Rest"}<br><small class="hint">${fmtDow(d)} ${fmtShort(d)}</small>${ctx}</td>
        ${cell(m.bloatScore, base && base.bloatScore)}${cell(m.burps, base && base.burps)}${cell(m.gas, base && base.gas)}<td class="num">${st}</td><td class="num">${lag}</td></tr>`;
    }).join("");
    const o = (state.settings.outcomes || {})[b.n] || {};
    const pill = o.result === "tolerated" ? '<span class="pill good">Tolerated</span>' : o.result === "partial" ? '<span class="pill mid">Partial</span>' : o.result === "not" ? '<span class="pill bad">Not tolerated</span>' : (t <= b.end ? '<span class="pill now">In progress</span>' : '<span class="pill">Result not set</span>');
    return `<div class="block-res">
      <div class="row" style="justify-content:space-between"><div><span class="blk-num">Block ${b.n}</span><h3>${esc(b.group)} · ${esc(b.food)}</h3></div>${pill}</div>
      <div class="tablewrap"><table class="rt"><thead><tr><th>Day</th><th>Bloating score</th><th>Burps</th><th>Gas</th><th>Stools (Bristol)</th><th>First symptom after food</th></tr></thead><tbody>${rows}</tbody></table></div>
      <p class="hint">${base ? `Your usual (${base.n} low FODMAP days before): bloating score ${r1(base.bloatScore)}, burps ${r1(base.burps)}, gas ${r1(base.gas)}, ${r1(base.stoolsPerDay)} stools a day. <span class="hi">Highlighted</span> values are clearly above that.` : "Log a few low FODMAP days before the block to get a baseline to compare against."}</p>
    </div>`;
  }).join("");
  return `<section class="card"><div class="sec-head"><h2>Reintroduction results</h2><a href="${PLAN_DOC}" target="_blank" rel="noopener">Open plan doc</a></div>
    <p class="hint">Bloating score adds up severity (mild 1, moderate 2, strong 3). Set each block's result in the Plan tab.</p>${out}</section>`;
}

/* ---------- Charts ---------- */
function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function attachTips(box) {
  let tip = box.querySelector(".tip");
  if (!tip) { tip = document.createElement("div"); tip.className = "tip"; tip.hidden = true; box.appendChild(tip); }
  box.querySelectorAll("[data-tip]").forEach(el => {
    const show = ev => {
      tip.innerHTML = el.getAttribute("data-tip"); tip.hidden = false;
      const br = box.getBoundingClientRect();
      const x = (ev.clientX ?? (el.getBoundingClientRect().left + 10)) - br.left + box.scrollLeft;
      const y = (ev.clientY ?? el.getBoundingClientRect().top) - br.top;
      const w = tip.offsetWidth;
      tip.style.left = Math.max(4, Math.min(x + 12, box.scrollWidth - w - 4)) + "px";
      tip.style.top = Math.max(4, y - tip.offsetHeight - 10) + "px";
    };
    el.addEventListener("pointermove", show);
    el.addEventListener("pointerenter", show);
    el.addEventListener("pointerleave", () => { tip.hidden = true; });
    el.addEventListener("focus", show);
    el.addEventListener("blur", () => { tip.hidden = true; });
  });
}

function drawDaily(sched) {
  const box = document.getElementById("dailyChart"); if (!box) return;
  const dates = box.dataset.dates.split(",");
  const W = Math.max(box.clientWidth, dates.length * 18 + 90);
  const left = 78, right = 8, top = 22;
  const rowH = 42, gap = 10, stoolH = 34, axisH = 24;
  const rows = [{ k: "bloatScore", label: "Bloating", c: "var(--bloat)" }, { k: "burps", label: "Burps", c: "var(--burp)" }, { k: "gas", label: "Gas", c: "var(--gas)" }];
  const H = top + rows.length * (rowH + gap) + stoolH + axisH;
  const cw = (W - left - right) / dates.length;
  const bw = Math.max(4, Math.min(18, cw - 4));
  const ms = dates.map(d => metrics(state.days[d]));
  let svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily symptoms chart">`;
  // challenge bands
  dates.forEach((d, i) => {
    const e = sched.map[d];
    if (e && (e.kind === "challenge" || e.kind === "bonus")) {
      const x = left + i * cw;
      svg += `<rect x="${x + 1}" y="${top - 6}" width="${cw - 2}" height="${H - top - axisH + 6}" rx="4" fill="var(--accent-soft)"/>`;
      svg += `<rect x="${x + cw / 2 - 4}" y="${top - 18}" width="8" height="8" transform="rotate(45 ${x + cw / 2} ${top - 14})" fill="var(--accent)"/>`;
    }
  });
  rows.forEach((r, ri) => {
    const y0 = top + ri * (rowH + gap);
    const max = Math.max(1, ...ms.map(m => m[r.k]));
    svg += `<text x="0" y="${y0 + rowH - 4}" font-size="12" fill="var(--muted)">${r.label}</text>`;
    svg += `<text x="${left - 8}" y="${y0 + 9}" font-size="10" text-anchor="end" fill="var(--muted)">${max}</text>`;
    svg += `<line x1="${left}" x2="${W - right}" y1="${y0 + rowH}" y2="${y0 + rowH}" stroke="var(--line)"/>`;
    ms.forEach((m, i) => {
      const v = m[r.k]; const x = left + i * cw + (cw - bw) / 2;
      const h = v ? Math.max(3, (v / max) * (rowH - 4)) : 0;
      const tipTxt = `<strong>${fmtDow(dates[i])} ${fmtShort(dates[i])}</strong><br>${r.label}: ${v}${r.k === "bloatScore" ? ` (score, ${m.bloatN} episode${m.bloatN === 1 ? "" : "s"})` : ""}`;
      if (h) svg += `<path d="M${x},${y0 + rowH} v${-(h - 4)} q0,-4 4,-4 h${bw - 8} q4,0 4,4 v${h - 4} z" fill="${r.c}"/>`;
      svg += `<rect x="${left + i * cw}" y="${y0}" width="${cw}" height="${rowH}" fill="transparent" data-tip="${esc(tipTxt)}" tabindex="-1"/>`;
    });
  });
  // stool row
  const ys = top + rows.length * (rowH + gap);
  svg += `<text x="0" y="${ys + 18}" font-size="12" fill="var(--muted)">Stools</text>`;
  ms.forEach((m, i) => {
    const cx = left + i * cw + cw / 2;
    const k = m.stools.length;
    m.stools.slice(0, 4).forEach((v, j) => {
      const band = BRISTOL[v - 1].band;
      const r = Math.min(5, cw / 3);
      const cy = ys + 8 + j * (r * 2 + 1.5);
      svg += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--${band})" stroke="var(--surface)" stroke-width="1.5"/>`;
    });
    const tipTxt = `<strong>${fmtDow(dates[i])} ${fmtShort(dates[i])}</strong><br>${k ? `Stools: ${m.stools.map(v => "type " + v).join(", ")}` : "No bowel movement logged"}`;
    svg += `<rect x="${left + i * cw}" y="${ys}" width="${cw}" height="${stoolH}" fill="transparent" data-tip="${esc(tipTxt)}"/>`;
  });
  // x axis labels
  const every = Math.max(1, Math.ceil(48 / cw));
  dates.forEach((d, i) => {
    if ((dates.length - 1 - i) % every) return;
    svg += `<text x="${left + i * cw + cw / 2}" y="${H - 6}" font-size="10.5" text-anchor="middle" fill="var(--muted)">${d === todayIso() ? "Today" : fmtShort(d)}</text>`;
  });
  svg += "</svg>";
  box.innerHTML = svg;
  attachTips(box);
}

function drawHours() {
  const box = document.getElementById("hourChart"); if (!box) return;
  const dates = box.dataset.dates.split(",");
  const counts = Array.from({ length: 24 }, () => ({ bloat: 0, burp: 0, gas: 0 }));
  dates.forEach(d => ((state.days[d] || {}).events || []).forEach(e => { if (counts[0][e.type] !== undefined) counts[Math.floor(hmToMin(e.t) / 60) % 24][e.type]++; }));
  const W = Math.max(box.clientWidth, 360), H = 150, left = 26, right = 6, top = 10, bottom = 22;
  const cw = (W - left - right) / 24, bw = Math.max(4, cw - 3);
  const tot = counts.map(c => c.bloat + c.burp + c.gas);
  const max = Math.max(1, ...tot);
  const ph = H - top - bottom;
  let svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Symptoms by hour of day">`;
  [0.5, 1].forEach(f => { const y = top + ph - f * ph; svg += `<line x1="${left}" x2="${W - right}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-dasharray="2 3"/><text x="${left - 5}" y="${y + 3}" font-size="10" text-anchor="end" fill="var(--muted)">${r1(max * f)}</text>`; });
  svg += `<line x1="${left}" x2="${W - right}" y1="${top + ph}" y2="${top + ph}" stroke="var(--line)"/>`;
  counts.forEach((c, h) => {
    const x = left + h * cw + (cw - bw) / 2;
    let y = top + ph;
    const segs = [["bloat", "var(--bloat)"], ["burp", "var(--burp)"], ["gas", "var(--gas)"]].filter(s => c[s[0]]);
    segs.forEach(([k, col], si) => {
      const hgt = (c[k] / max) * ph;
      const isTop = si === segs.length - 1;
      const hh = Math.max(1, hgt - (si ? 2 : 0));
      if (isTop && hh > 4) svg += `<path d="M${x},${y} v${-(hh - 3)} q0,-3 3,-3 h${bw - 6} q3,0 3,3 v${hh - 3} z" fill="${col}"/>`;
      else svg += `<rect x="${x}" y="${y - hh}" width="${bw}" height="${hh}" fill="${col}"/>`;
      y -= hgt;
    });
    const tipTxt = `<strong>${pad(h)}:00 to ${pad((h + 1) % 24)}:00</strong><br>Bloating ${c.bloat} · Burps ${c.burp} · Gas ${c.gas}`;
    svg += `<rect x="${left + h * cw}" y="${top}" width="${cw}" height="${ph}" fill="transparent" data-tip="${esc(tipTxt)}"/>`;
    if (h % 3 === 0) svg += `<text x="${left + h * cw + cw / 2}" y="${H - 6}" font-size="10.5" text-anchor="middle" fill="var(--muted)">${pad(h)}h</text>`;
  });
  svg += "</svg>";
  box.innerHTML = svg;
  attachTips(box);
}

function drawDayLines() {
  const box = document.getElementById("dayLines"); if (!box) return;
  const dates = rangeDates(7).reverse();
  const W = Math.max(box.clientWidth, 360), left = 62, right = 10, rowH = 36, top = 6, axisH = 22;
  const H = top + dates.length * rowH + axisH;
  const x = m => left + (m / 1440) * (W - left - right);
  let svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Meals and symptoms per day">`;
  [0, 6, 12, 18, 24].forEach(h => { svg += `<line x1="${x(h * 60)}" x2="${x(h * 60)}" y1="${top}" y2="${H - axisH}" stroke="var(--line)" stroke-dasharray="2 3"/><text x="${x(h * 60)}" y="${H - 6}" font-size="10.5" text-anchor="middle" fill="var(--muted)">${pad(h % 24)}:00</text>`; });
  dates.forEach((d, i) => {
    const y = top + i * rowH + rowH / 2;
    const day = state.days[d] || emptyDay(d);
    svg += `<text x="0" y="${y + 4}" font-size="11.5" fill="var(--muted)">${d === todayIso() ? "Today" : fmtDow(d) + " " + parse(d).getDate()}</text>`;
    svg += `<line x1="${left}" x2="${W - right}" y1="${y}" y2="${y}" stroke="var(--line)"/>`;
    MEALS.forEach(mm => { const m = (day.meals || {})[mm.k]; if (!m || !(m.foods || []).length) return;
      const cx = x(hmToMin(m.time || mm.def));
      svg += `<rect x="${cx - 6}" y="${y - 6}" width="12" height="12" rx="3" fill="var(--surface)" stroke="var(--muted)" stroke-width="2" data-tip="${esc(`<strong>${mm.label} ${m.time || mm.def}</strong><br>${esc(m.foods.join(", "))}`)}"/>`; });
    if (day.challenge && day.challenge.ate) { const cx = x(hmToMin(day.challenge.t));
      svg += `<rect x="${cx - 6}" y="${y - 6}" width="12" height="12" transform="rotate(45 ${cx} ${y})" fill="var(--accent)" stroke="var(--surface)" stroke-width="2" data-tip="${esc(`<strong>Challenge ${day.challenge.t}</strong><br>${esc(day.challenge.food)}, ${day.challenge.grams} g`)}"/>`; }
    (day.events || []).forEach(e => {
      if (e.type === "stool") return;
      const cx = x(hmToMin(e.t)); const r = e.type === "bloat" ? 4 + (e.v || 1) : 4.5;
      const col = SYM[e.type].color;
      const lbl = e.type === "bloat" ? `${SEV[e.v || 1]} bloating` : SYM[e.type].label;
      svg += `<circle cx="${cx}" cy="${y}" r="${r}" fill="${col}" stroke="var(--surface)" stroke-width="2" data-tip="${esc(`<strong>${e.t}</strong><br>${lbl}`)}"/>`;
    });
  });
  svg += "</svg>";
  box.innerHTML = svg;
  attachTips(box);
}

/* ---------- Plan view ---------- */
function renderPlan(sched) {
  const t = todayIso();
  const outcomes = state.settings.outcomes || {};
  const blocks = sched.blocks.map(b => {
    const cur = t >= b.start && t <= b.end;
    const status = t > b.end ? "Done" : cur ? "Now" : "Upcoming";
    const o = outcomes[b.n] || {};
    return `<div class="blk ${cur ? "current" : ""}">
      <div class="blk-top"><div><span class="blk-num">Block ${b.n} · ${fmtShort(b.start)} to ${fmtShort(addDays(b.start, 2))}, rest until ${fmtShort(b.end)}</span><h3>${esc(b.group)}</h3><span class="hint">${esc(b.food)}</span></div>
        <span class="pill ${cur ? "now" : ""}">${status}</span></div>
      <div class="blk-portions">${b.g.map((g, i) => `<span>Day ${i + 1} · ${g} g</span>`).join("")}</div>
      <div class="row">
        <span class="hint">Rest days: <strong class="mono">${b.restDays}</strong></span>
        <button class="btn small" data-rest="${b.n}" data-delta="1">+ Add rest day</button>
        ${b.restDays > 2 ? `<button class="btn small ghost" data-rest="${b.n}" data-delta="-1">Remove one</button>` : ""}
      </div>
      <div class="row">
        <label class="hint" for="res-${b.n}">Result</label>
        <select id="res-${b.n}" data-outcome="${b.n}">
          <option value="">Not set</option>
          <option value="tolerated" ${o.result === "tolerated" ? "selected" : ""}>Tolerated</option>
          <option value="partial" ${o.result === "partial" ? "selected" : ""}>Partial tolerance</option>
          <option value="not" ${o.result === "not" ? "selected" : ""}>Not tolerated</option>
        </select>
        <label class="hint" for="por-${b.n}">Last portion tolerated</label>
        <select id="por-${b.n}" data-portion="${b.n}">
          <option value="">-</option>${["none", ...b.g].map(g => `<option value="${g}" ${String(o.portion) === String(g) ? "selected" : ""}>${g === "none" ? "None" : g + " g"}</option>`).join("")}
        </select>
      </div>
    </div>`;
  }).join("");
  const bonus = BONUS.map((x, i) => {
    const d = addDays(sched.bonusStart, i);
    return `<tr><td>${fmtShort(d)}</td><td>${x.rest ? "Rest day" : esc(x.food)}</td><td class="num">${x.rest ? "" : x.grams + " g"}</td><td>${x.rest ? "Strict low FODMAP before the appointment" : esc(x.onlyIf)}</td></tr>`;
  }).join("");
  return `<div class="sec-head"><h2>Reintroduction plan</h2><a href="${PLAN_DOC}" target="_blank" rel="noopener">Open full plan</a></div>
    <section class="card">
      <p>Each block is 3 challenge days with increasing portions, then at least 2 rest days on strict low FODMAP. Eat the challenge food once a day, ideally at lunch.</p>
      <div class="row"><label class="hint" for="planStart">Plan starts on</label><input type="date" id="planStart" class="field mono" style="width:auto" value="${esc(sched.start)}"></div>
      <details><summary>Ground rules</summary>
        <ol class="rules" style="margin-top:8px">
          <li>Test one food at a time. Keep everything else low FODMAP and similar from day to day.</li>
          <li>Keep the probiotic dose and timing unchanged for the whole plan.</li>
          <li>Stop increasing as soon as symptoms are moderate. Go straight to rest days and note the last portion you tolerated.</li>
          <li>Rest until you are back to baseline. If that takes longer than 2 days, add a rest day here and the calendar shifts.</li>
          <li>Avoid starting a block during unusual weeks: travel, illness, exams, alcohol, a new medication.</li>
          <li>Weigh portions with a kitchen scale.</li>
        </ol>
      </details>
      <details><summary>Reading your reactions</summary>
        <div class="tablewrap" style="margin-top:8px"><table class="rt"><thead><tr><th>What happened</th><th>What it means</th><th>What to do</th></tr></thead><tbody>
          <tr><td>No symptoms up to day 3</td><td><span class="pill good">Tolerated</span></td><td>Add it back after the plan, up to the day 3 portion</td></tr>
          <tr><td>Mild symptoms on day 2 or 3</td><td><span class="pill mid">Partial</span></td><td>Use the portion from the day before as your limit</td></tr>
          <tr><td>Moderate or strong symptoms on day 1</td><td><span class="pill bad">Not tolerated</span></td><td>Avoid it and retest in 2 to 3 months</td></tr>
        </tbody></table></div>
        <p class="hint" style="margin-top:8px">Contact your doctor without waiting if you see blood in your stool, unexplained weight loss, fever, severe pain, or diarrhea that wakes you at night.</p>
      </details>
    </section>
    <div class="blocks">${blocks}</div>
    <section class="card"><div class="sec-head"><h2>Bonus tests</h2><span class="hint">Only if the groups they contain went well</span></div>
      <div class="tablewrap"><table class="rt"><thead><tr><th>Date</th><th>Food</th><th>Portion</th><th>Only if</th></tr></thead><tbody>${bonus}</tbody></table></div>
    </section>`;
}

      <div class="addfood">

      ${(state.settings.customFoods || []).length ? `<div class="foodcat"><h3>Typed in meals</h3><span class="hint">Foods you typed in the meal picker. Add them above with a category to file them properly.</span><div class="chips">${state.settings.customFoods.map(f => `<span class="chip">${esc(f)}<button class="chip-x" data-rmcustom="${esc(f)}" aria-label="Remove ${esc(f)}">&#215;</button></span>`).join("")}</div></div>` : ""}</div>
      <p class="hint">Foods with a light green background are ones you added. Removing one keeps it in the meals you already logged.</p>

      <p class="hint">Export a backup file, or import one, for example when moving to your own website.</p>

      ${state.confirmImport ? `<div class="confirm"><p>This file has ${Object.keys(state.confirmImport.days || {}).length} days. Days with the same date will be replaced.</p><div class="row"><button class="btn primary" id="importYes">Import</button><button class="btn ghost" id="importNo">Cancel</button></div></div>` : ""}
      ${storageNote()}
    </section>`;
